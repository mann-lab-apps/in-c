[project]
name = "piano-performance"
version = "0.1.0"
description = "MVP skeleton for piano performance-engine deep learning experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "torch>=2.3",
  "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piano_performance"]

[project.optional-dependencies]
audio = [
  "librosa>=0.10",
  "mido>=1.3",
  "music21>=9.1",
  "pandas>=2.2",
  "pretty_midi>=0.2.10",
  "scipy>=1.12",
  "torchaudio>=2.3",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
