          <h1 id="login-title">로그인 준비 중</h1>
          <p>
            지금은 공개 콘텐츠를 먼저 둘러볼 수 있고, 계정 생성과 공연 등록은

        <form class="login-panel" aria-label="로그인 준비 상태">
          <label>
            <span>이메일</span>
            <input
              type="email"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
              disabled
            />
          </label>
          <span
            class="disabled-tooltip"
            data-tooltip="준비중입니다! 조금만 더 기다려주세요"
            tabindex="0"
            aria-label="매직링크 받기. 준비중입니다! 조금만 더 기다려주세요"
          >
            <span class="button button--primary" aria-disabled="true">매직링크 받기</span>
          </span>
          <p>
            현재 화면에서는 이메일을 저장하거나 계정을 만들지 않습니다.
          </p>
