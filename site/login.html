    />

    <meta property="og:image:alt" content="in C 앱 아이콘" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="로그인 | in C" />
    <meta
      name="twitter:description"
      content="Google 계정으로 in C에 로그인합니다. 카카오와 네이버 로그인은 준비 중입니다."
    />
    <meta name="twitter:image" content="https://in-c.mannlab.app/social-preview.png" />
    <meta name="twitter:image:alt" content="in C 앱 아이콘" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="sitemap" type="application/xml" href="./sitemap.xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html#top" aria-label="in C home">
        <img src="./assets/icon.svg" width="36" height="36" alt="" />
        <span>in C</span>
      </a>
      <nav aria-label="주요 링크">
        <a href="./columns.html">Columns</a>
        <a href="./concerts.html">Concerts</a>
        <a href="./community.html">Community</a>
        <a href="./chromatics.html">Chromatics</a>
        <a class="nav-login-link" aria-current="page" href="./login.html">로그인</a>
      </nav>
    </header>

    <main id="top">
      <section class="login-shell" aria-labelledby="login-title">
        <section class="login-panel" aria-label="간편로그인">
          <div class="login-panel__head">
            <h1 id="login-title">간편로그인</h1>
            <p data-auth-status role="status" aria-live="polite">
              로그인 상태를 확인하고 있습니다.
            </p>
          </div>

          <div class="social-login-list" data-auth-actions>
            <button
              class="social-login-button"
              data-auth-provider="google"
              data-auth-provider-label="Google 로그인"
              type="button"
            >
              <span aria-hidden="true">G</span>
              Google로 계속하기
            </button>
            <button
              class="social-login-button"
              data-auth-pending-provider="kakao"
              type="button"
            >
              <span aria-hidden="true">K</span>
              카카오로 계속하기
            </button>
          </div>

          <div class="auth-session" data-auth-session hidden>
            <div>
              <p class="eyebrow">Signed in</p>
              <h2 data-auth-user-name>로그인됨</h2>
              <p data-auth-user-email></p>
            </div>
            <button class="button button--secondary" data-auth-sign-out type="button">
              로그아웃
            </button>
          </div>

          <p class="login-panel__note">
            카카오는 이메일 제공 권한 확인 뒤 연결합니다. 네이버 로그인은 다음 단계에서 추가합니다.
          </p>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 mann-lab-apps. in C 계정 로그인 페이지입니다.</p>
      <div>
        <a href="./index.html">홈</a>
        <a href="./concerts.html">Concerts</a>
        <a href="./privacy.html">고지</a>
      </div>
    </footer>
    <script type="module" src="./login.js"></script>
  </body>
</html>
