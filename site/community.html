  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="in C Community에서 감상 질문, 악보 사용 경험, Chromatics 피드백을 게시판으로 나눕니다."
    />
    <link rel="canonical" href="https://in-c.mannlab.app/community.html" />
    <meta property="og:title" content="Community | in C" />
    <meta property="og:description" content="감상 질문, 악보 사용 경험, Chromatics 피드백을 게시판으로 나눕니다." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://in-c.mannlab.app/community.html" />
    <meta property="og:site_name" content="in C" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://in-c.mannlab.app/social-preview.png" />
    <meta property="og:image:alt" content="in C 앱 아이콘" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Community | in C" />
    <meta name="twitter:description" content="감상 질문, 악보 사용 경험, Chromatics 피드백을 게시판으로 나눕니다." />
    <meta name="twitter:image" content="https://in-c.mannlab.app/social-preview.png" />
    <meta name="twitter:image:alt" content="in C 앱 아이콘" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="sitemap" type="application/xml" href="./sitemap.xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-product-page="community">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="in C home">
        <img src="./assets/icon.svg" width="36" height="36" alt="" />
        <span>in C</span>
      </a>
      <nav aria-label="주요 링크">
        <a href="./columns.html">Columns</a>
        <a href="./concerts.html">Concerts</a>
        <a href="./community.html" aria-current="page">Community</a>
        <a href="./chromatics.html">Chromatics</a>
        <a class="nav-login-link" href="./login.html">로그인</a>
      </nav>
    </header>
    <main>
      <section class="hero hero--compact" aria-labelledby="community-title">
        <div class="hero__content">
          <p class="eyebrow">Community</p>
          <h1 id="community-title">Community</h1>
          <p class="hero__lead">
            감상 질문, 악보 사용 경험, Chromatics 피드백을 함께 모읍니다.
          </p>
        </div>
      </section>

      <section class="section community-board" aria-labelledby="community-board-title">
        <header class="community-board__header">
          <div>
            <p class="eyebrow">Board</p>
            <h2 id="community-board-title">게시판</h2>
            <p>
              공개 글은 누구나 읽고, 로그인한 사용자는 글과 댓글을 남길 수 있습니다.
            </p>
          </div>
          <div class="community-board__actions" data-community-write-action></div>
        </header>

        <div class="community-board__toolbar" aria-label="게시글 분류">
          <button class="is-active" data-community-category="" type="button">전체</button>
          <button data-community-category="question" type="button">질문</button>
          <button data-community-category="feedback" type="button">피드백</button>
          <button data-community-category="general" type="button">일반</button>
          <button data-community-category="notice" type="button">공지</button>
        </div>

        <p class="community-status" data-community-status role="status" aria-live="polite">
          게시글을 불러오는 중입니다.
        </p>

        <div class="community-board__layout">
          <section class="community-panel" aria-labelledby="community-list-title">
            <div class="community-section-head">
              <p class="eyebrow">Posts</p>
              <h3 id="community-list-title">목록</h3>
            </div>
            <ul class="community-post-list" data-community-posts></ul>
          </section>

          <section class="community-panel community-panel--detail" aria-labelledby="community-detail-title" data-community-detail hidden>
            <div class="community-section-head">
              <p class="eyebrow">Detail</p>
              <h3 id="community-detail-title">상세</h3>
            </div>
            <div data-community-detail-body></div>
          </section>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <p>© 2026 mann-lab-apps. Community는 Supabase 기반 MVP로 운영합니다.</p>
      <div>
        <a href="./columns.html">Columns</a>
        <a href="./concerts.html">Concerts</a>
      </div>
    </footer>
    <script type="module" src="./community.js"></script>
  </body>
</html>
