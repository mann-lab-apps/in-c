      content="관객 타깃, 홍보 문구, 채널 선택이 고민인 클래식 연주자와 기획자를 위한 관심 등록 페이지입니다."

  </head>
  <body class="pilot-page">
    <header class="site-header pilot-header">
      <a class="brand" href="#top" aria-label="in C home">
        <img src="./assets/icon.svg" width="36" height="36" alt="" />
        <span>in C</span>
      </a>
      <nav aria-label="페이지 링크">
        <a href="#pilot-form">관심 등록</a>
        <a href="./privacy.html">고지</a>
      </nav>
    </header>

    <main id="top" class="pilot-main">
      <section class="pilot-intro" aria-labelledby="pilot-title">
        <div class="pilot-intro__copy">
          <p class="eyebrow">Classical Concert Growth</p>
          <h1 id="pilot-title">클래식 연주회 홍보 관심 등록</h1>
          <p class="pilot-intro__lead">
            연주회 홍보가 막막한 연주자와 기획자를 위해 관객 타깃, 홍보 문구,
            채널 방향을 함께 정리하는 실험을 준비하고 있습니다.
          </p>
        </div>
      </section>

      <section id="pilot-form" class="pilot-form-section" aria-labelledby="form-title">
        <header class="pilot-form-section__head">
          <p class="eyebrow">Interest</p>
          <h2 id="form-title">관심 등록</h2>
          <p>
            제출하면 in C가 직접 확인하고 남겨주신 연락처로 다음 안내를 드립니다.
            연주회 세부 정보는 후속 대화에서 필요한 만큼만 정리합니다.
          </p>
        </header>

        <form class="pilot-form" data-pilot-form>
          <fieldset>
            <legend>신청자</legend>
            <label>
              <span>신청자 이름</span>
              <input autocomplete="name" maxlength="80" name="applicantName" required type="text" />
            </label>
            <label>
              <span>역할</span>
              <select name="role" required>
                <option value="">선택해 주세요</option>
                <option value="performer">연주자</option>
                <option value="planner">기획자</option>
                <option value="ensemble">단체/앙상블</option>
                <option value="other">기타</option>
              </select>
            </label>
            <label>
              <span>전화</span>
              <input
                autocomplete="tel"
                maxlength="80"
                name="contactPhone"
                placeholder="010-0000-0000"
                type="tel"
              />
            </label>
            <label>
              <span>이메일</span>
              <input autocomplete="email" maxlength="160" name="contactEmail" type="email" />
            </label>
            <label>
              <span>인스타 ID</span>
              <input
                autocomplete="username"
                maxlength="80"
                name="contactInstagram"
                placeholder="@in_c"
                type="text"
              />
            </label>
            <p class="pilot-form__note">전화, 이메일, 인스타 ID 중 하나 이상 입력해 주세요.</p>
          </fieldset>

          <fieldset>
            <legend>현재 상황</legend>
            <div class="pilot-options" role="radiogroup" aria-label="연주회 준비 상태">
              <label>
                <input name="upcomingRecital" required type="radio" value="scheduled" />
                <span>날짜가 잡힌 클래식 연주회가 있어요.</span>
              </label>
              <label>
                <input name="upcomingRecital" required type="radio" value="planning" />
                <span>연주회를 준비 중이고 홍보 방향을 미리 잡고 싶어요.</span>
              </label>
              <label>
                <input name="upcomingRecital" required type="radio" value="notYet" />
                <span>아직 정해진 연주회는 없지만 관심이 있어요.</span>
              </label>
            </div>

            <div class="pilot-options" aria-label="필요한 도움">
              <label>
                <input name="helpNeeded" type="checkbox" value="audienceTarget" />
                <span>어떤 관객에게 말해야 할지 정리하고 싶어요.</span>
              </label>
              <label>
                <input name="helpNeeded" type="checkbox" value="copywriting" />
                <span>연주회 소개 문구와 콘텐츠 방향이 필요해요.</span>
              </label>
              <label>
                <input name="helpNeeded" type="checkbox" value="channels" />
                <span>어디에 어떻게 알려야 할지 모르겠어요.</span>
              </label>
              <label>
                <input name="helpNeeded" type="checkbox" value="report" />
                <span>홍보 후 반응을 숫자와 메모로 확인하고 싶어요.</span>
              </label>
              <label>
                <input name="helpNeeded" type="checkbox" value="design" />
                <span>홍보 이미지나 포스터 디자인도 함께 고민하고 싶어요.</span>
              </label>
              <label>
                <input name="helpNeeded" type="checkbox" value="notSure" />
                <span>무엇이 필요한지부터 같이 정리하고 싶어요.</span>
              </label>
            </div>
            <label class="pilot-form__wide">
              <span>비고</span>
              <textarea maxlength="1600" name="notes" rows="5"></textarea>
            </label>
            <label class="pilot-form__wide pilot-form__check">
              <input name="privacyAcknowledgement" required type="checkbox" />
              <span>입력 내용을 관심 확인과 후속 연락 목적으로 저장하는 데 동의합니다.</span>
            </label>
          </fieldset>

          <p class="pilot-status" data-pilot-status hidden role="status" aria-live="polite"></p>

          <div class="pilot-form__actions">
            <button class="button button--primary" data-pilot-submit type="submit">관심 등록하기</button>
            <button class="button button--secondary" type="reset">초기화</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer pilot-footer">
      <p>© 2026 mann-lab-apps.</p>
    </footer>

    <script type="module" src="./pilot-form.js"></script>
  </body>
