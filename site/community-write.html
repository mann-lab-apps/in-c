    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="글쓰기 | Community | in C" />

    <link rel="sitemap" type="application/xml" href="./sitemap.xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-product-page="community">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="in C home">
        <img src="./assets/icon.svg" width="36" height="36" alt="" />
        <span>in C</span>
      </a>
      <nav aria-label="주요 링크">
        <a href="./columns.html">Columns</a>
        <a href="./compositions.html">Compositions</a>
        <a href="./concerts.html">Concerts</a>
        <a href="./community.html">Community</a>
        <a href="./index.html#download">Chromatics</a>
        <a class="nav-login-link" href="./login.html">로그인</a>
      </nav>
    </header>
    <main>
      <section class="hero hero--compact" aria-labelledby="community-write-title">
        <div class="hero__content">
          <p class="eyebrow">Community</p>
          <h1 id="community-write-title" data-community-write-title>글쓰기</h1>
          <p class="hero__lead">
            질문, 피드백, 악보 사용 경험을 하나의 글로 정리합니다.
          </p>
        </div>
      </section>

      <section class="section community-board" aria-labelledby="community-form-title">
        <header class="community-board__header">
          <div>
            <p class="eyebrow">Write</p>
            <h2 id="community-form-title" data-community-form-title>새 글 작성</h2>
            <p data-community-form-description>
              작성 후 게시판 상세 화면으로 이동합니다.
            </p>
          </div>
          <a class="button button--secondary" href="./community.html">목록</a>
        </header>

        <p class="community-status" data-community-write-status role="status" aria-live="polite">
          로그인 상태를 확인하는 중입니다.
        </p>

        <section class="community-panel community-write-page-panel" data-community-write-auth hidden>
          <p>글을 작성하려면 로그인이 필요합니다.</p>
          <a class="button button--primary" href="./login.html">로그인</a>
        </section>

        <section class="community-panel community-write-page-panel" data-community-write-panel hidden>
          <form class="community-form" data-community-post-form>
            <label>
              <span>분류</span>
              <select name="category" required>
                <option value="question">질문</option>
                <option value="feedback">피드백</option>
                <option value="general">일반</option>
              </select>
            </label>
            <label>
              <span>제목</span>
              <input maxlength="120" minlength="2" name="title" required type="text" />
            </label>
            <label>
              <span>내용</span>
              <textarea maxlength="5000" minlength="2" name="body" required rows="12"></textarea>
            </label>
            <div class="community-form__actions">
              <button class="button button--primary" type="submit" data-community-submit>게시</button>
              <a class="button button--secondary" href="./community.html">취소</a>
            </div>
          </form>
        </section>
      </section>
    </main>
    <footer class="site-footer">
      <p>© 2026 mann-lab-apps. Community 글쓰기는 로그인 후 사용할 수 있습니다.</p>
      <div>
        <a href="./community.html">Community</a>
        <a href="./privacy.html">Privacy</a>
      </div>
    </footer>
    <script type="module" src="./community-write.js"></script>
  </body>
</html>
