<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="기러기 떼 비행을 중심으로 한 브랜드 그래픽"><style>@font-face{font-family:Pretendard;src:url("fonts/PretendardVariable.woff2") format("woff2");font-weight:100 900}</style><rect width="1440" height="1024" fill="#FFF6E8"/><text x="64" y="68" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="650" fill="#223C3B">GIREOGI / TOGETHER IN FLIGHT</text><text x="64" y="152" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="800" fill="#223C3B">각자의 날갯짓이,</text><text x="64" y="218" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="800" fill="#223C3B">함께 가는 방향으로.</text><text x="66" y="277" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="500" fill="#223C3B">서로의 시도에 응답하며 함께 나아가는 음악의 공간.</text><g transform="translate(510 30) scale(.96)"><g transform="translate(550 5) scale(0.64453125) rotate(-12 128 128)"><g fill="#223C3B"><path d="M131 153 C128 181 109 204 78 220 C89 191 92 170 104 156Z"/><path d="M86 167 L65 183 L96 178 C125 176 143 155 161 137 L208 116 C218 113 230 117 236 110 C246 100 239 89 229 89 C219 88 215 96 207 99 L164 114 C137 124 119 151 100 157Z"/><path d="M108 157 C100 130 80 92 59 56 C98 66 133 96 148 128 L137 151Z"/><path d="M238 98 L252 104 L239 108Z"/></g></g><g transform="translate(390 70) scale(0.58984375) rotate(-12 128 128)"><g fill="#223C3B"><path d="M131 153 C132 175 116 199 91 212 C97 187 94 168 104 156Z"/><path d="M86 167 L65 183 L96 178 C125 176 143 155 161 137 L208 116 C218 113 230 117 236 110 C246 100 239 89 229 89 C219 88 215 96 207 99 L164 114 C137 124 119 151 100 157Z"/><path d="M109 154 C80 135 49 127 20 122 C54 102 104 106 145 133 L136 153Z"/><path d="M238 98 L252 104 L239 108Z"/></g></g><g transform="translate(590 160) scale(0.58984375) rotate(-12 128 128)"><g fill="#223C3B"><path d="M131 153 C132 175 116 199 91