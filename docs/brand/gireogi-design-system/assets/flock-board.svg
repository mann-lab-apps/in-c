51 100 157Z"/><path d="M109 154 C80 135 49 127 20 122 C54 102 104 106 145 133 L136 153Z"/><path d="M238 98 L252 104 L239 108Z"/></g></g></g><text x="64" y="470" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="650" fill="#223C3B">01  간격</text><text x="64" y="502" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="500" fill="#223C3B">붙여 놓기보다, 서로 움직일 자리를 남긴다.</text><text x="64" y="560" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="650" fill="#223C3B">02  응답</text><text x="64" y="592" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="500" fill="#223C3B">날갯짓은 조금씩 다르고, 흐름은 이어진다.</text><text x="64" y="650" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="650" fill="#223C3B">03  지속</text><text x="64" y="682" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="500" fill="#223C3B">경로가 굽어도 함께 향하는 느낌을 유지한다.</text><rect x="0" y="760" width="1440" height="264" fill="#223C3B"/><text x="64" y="823" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="650" fill="#FFF6E8">SMALL MARK / LARGE SCENE</text><g transform="translate(58 840) scale(.5)"><g fill="#FFF6E8"><path d="M142 151 C148 126 145 87 160 64 C173 43 200 45 205 63 C211 82 191 87 178 89 C162 100 163 124 166 147 C171 179 143 201 108 202 C72 204 43 187 29 164 L53 153 C77 182 135 183 142 151Z"/><path d="M40 149 C80 148 103 106 178 106 C174 144 135 181 84 181 C62 181 49 169 40 149Z"/><path class="cut" d="M66 164 C93 163 114 146 143 137 C128 165 92 186 66 164Z"/><path class="beak" d="M206 64 L233 77 Q234 82 208 83 L202 82Z"/><circle class="cut" cx="193" cy="62" r="3.5"/></g><style>.cut{fill:#223C3B;stroke:none}.beak{fill:#F5B878;stroke:none}</style></g><text x="210" y="904" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="800" fill="#FFF6E8">기러기</text><text x="210" y="941" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="500" fill="#FFF6E8">작게는 한 표식, 넓게는 서로 이어지는 무리.</text><g transform="translate(930 760) scale(.43)"><g transform="translate(550 5) scale(0.64453125) rotate(-12 128 128)"><g fill="#FFF6E8"><path d="M131 153 C128 181 109 204 78 220 C89 191 92 170 104 156Z"/><path d="M86 167 L65 183 L96 178 C125 176 143 155 161 137 L208 116 C218 113 230 117 236 110 C246 100 239 89 229 89 C219 88 215 96 207 99 L164 114 C137 124 119 151 100 157Z"/><path d="M108 157 C100 130 80 92 59 56 C98 66 133 96 148 128 L137 151Z"/><path d="M238 98 L252 104 L239 108Z"/></g></g><g transform="translate(390 70) scale(0.58984375) rotate(-12 128 128)"><g fill="#FFF6E8"><path d="M131 153 C132 175 116 199 91 212 C97 187 94 168 104 156Z"/><path d="M86 167 L65 183 L96 178 C125 176 143 155 161 137 L208 116 C218 113 230 117 236 110 C246 100 239 89 229 89 C219 88 215 96 207 99 L164 114 C137 124 119 151 100 157Z"/><path d="M109 154 C80 135 49 127 20 122 C54 102 104 106 145 133 L136 153Z"/><path d="M238 98 L252 104 L239 108Z"/></g></g><g transform="translate(590 160) scale(0.58984375) rotate(-12 128 128)"><g fill="#FFF6E8"><path d="M131 153 C132 175 116 199 91 212 C97 187 94 168 104 156Z"/><path d="M86 167 L65 183 L96 178 C125 176 143 155 161 137 L208 116 C218 113 230 117 236 110 C246 100 239 89 229 89 C219 88 215 96 207 99 L164 114 C137 124 119 151 100 157Z"/><path d="M109 154 C80 135 49 127 20 122 C54 102 104 106 145 133 L136 153Z"/><path d="M238 98 L252 104 L239 108Z"/></g></g><g transform="translate(235 135) scale(0.53515625) rotate(-12 128 128)"><g fill="#FFF6E8"><path d="M131 153 C128 181 109 204 78 220 C89 191 92 170 104 156Z"/><path d="M86 167 L65 183 L96 178 C125 176 143 155 161 137 L208 116 C218 113 230 117 236 110 C246 100 239 89 229 89 C219 88 215 96 207 99 L164 114 C137 124 119 151 100 157Z"/><path d="M108 157 C100 130 80 92 59 56 C98 66 133 96 148 128 L137 151Z"/><path d="M238 98 L252 104 L