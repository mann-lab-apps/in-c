6E8;stroke:none}.beak{fill:#F5B878;stroke:none}</style></g><text x="1190" y="695" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="650" fill="#223C3B">Stage</text><text x="64" y="792" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" fill="#223C3B">날개 윤곽은 Play에 1회, Note에 2회, Stage에 회전·대칭으로 재사용한다. Studio는 깃, Talk는 머리·부리를 확장한다.</text></svg>