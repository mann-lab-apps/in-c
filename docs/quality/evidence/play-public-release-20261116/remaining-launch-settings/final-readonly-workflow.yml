name: Play launch settings read-only preflight
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Read-only settings check label
        required: true
        type: string
permissions:
  contents: read
jobs:
  check-settings:
    runs-on: [self-hosted, macOS, ARM64, in-c-release]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate exact launch-setting preconditions without writes
        working-directory: deployment
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_GEMFILE: /Users/jaemankim/Desktop/privates/coding/worktrees/ddirori-play-library-context-20261031/deployment/Gemfile
          BUNDLE_PATH: /Users/jaemankim/Desktop/privates/coding/in-c/deployment/vendor/bundle
        run: /opt/homebrew/bin/bundle exec /opt/homebrew/bin/ruby inspect_play_launch_settings.rb --dry-run
      - name: Preserve public-field-only precondition result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-launch-settings-${{ github.run_id }}
          path: deployment/play-launch-settings-result.json
          retention-days: 14
