  build_id: a75f2996-e8e6-4516-a990-1a6b05b3216e
  description: 로컬 음원을 가져와 곡 목록에서 바로 재생하고, 원하는 음원을 작품·녹음·악장으로 정리하는 흐름을 테스트합니다.
  test_notes: |-
    보관함의 재생목록에서 목록을 만든 뒤 검색으로 곡 두 개를 함께 선택해 추가하고, 편집에서 드래그로 순서를 바꿔 재생해 주세요. 곡·앨범·검색 결과의 더보기와 현재 재생에서도 재생목록에 담을 수 있습니다. 목록 삭제나 곡 제거로 원본 파일이 삭제되어서는 안 됩니다. 앱 재시작 후에도 목록과 순서가 유지되고 누락 곡은 목록에 남지만 재생에서는 건너뛰는지 확인해 주세요. 폴더별 보기는 도구 메뉴에 있습니다.
    보관함의 곡·앨범·아티스트·재생목록 행을 열어 목록 안 검색과 곡 정렬을 확인해 주세요. 재생 중 검색·정렬을 바꾸어도 큐와 현재 위치가 유지되고, 누락 파일은 파일 상태 확인으로 이어져야 합니다.
    빈 보관함에서 파일을 가져와 곡 목록에 표시되는지, 작품 등록 전에 바로 재생되는지 확인해 주세요. 축약 조작과 전체 재생 화면의 큐를 확인해 주세요.
    R3: 여러 파일 중 일부가 실패해도 완료한 곡이 남는지, 실패한 선택만 재시도되는지 확인해 주세요. 가져온 곡의 작품·녹음 정리를 취소하거나 저장 실패로 재시도해도 원본과 큐가 유지되어야 합니다. 등록 후 첫 재생 안내는 실제 재생 시작 뒤에만 나타납니다.
    앱 관리 복사본 내보내기 성공 뒤 연결 방법을 열어 파일 앱 보관→Score 악보 선택→연결 파일 추가의 수동 경로를 확인해 주세요. 공유 완료는 Score 저장 완료가 아닙니다.
    앨범·아티스트·재생목록 탐색과 내 음악 검색을 확인해 주세요. 폴더별 보기·클래식 정리·감상 기록·음악 발견·IMSLP는 상단 도구 더보기에서 접근합니다.
    R2: A 녹음 재생 중 검색으로 B 녹음을 열어도 A의 큐·악장·위치가 유지되는지 확인해 주세요. 넓은 화면 옆 재생 영역과 좁은 화면 하단 조작/재생 상세를 확인해 주세요.
    같은 녹음의 큐는 작품·녹음 맥락을 한 번 표시하며 혼합 큐는 구간별로 구분합니다. 음원 정보 N에서 파일명·출처를, 녹음 정보 열기에서 상세를 확인해 주세요. 재시도는 기존 큐 첫 악장부터 시작합니다.
    작품·녹음 검색·필터·정렬은 보관함 아래의 클래식 영역에서 확인해 주세요. 탐색·검색·테마 변경만으로 큐나 재생 위치가 초기화되면 안 됩니다.
    도구 메뉴의 가져오기·파일 상태에서 파일·폴더·요약을, 음원 정보·파일 복구에서 메타데이터·누락 파일 복구를, 감상 기록에서 이력·통계를 확인해 주세요. 재생의 오류 재시도와 길이 미확정 상태를 구분해 주세요.
    공통 quiet/secondary 버튼의 중립색과 선택 상태, 목록 선택 이름, 검색 입력과 기존 재생·queue 동선이 유지되는지 확인해 주세요.
    승인된 Play 아이콘 후보 08의 실제 런처 표시와 빈 보관함의 음악 가져오기 행동을 확인해 주세요. 실제 기기 렌더링과 스토어 스크린샷은 별도 검수입니다.
    큰 글씨·다크 모드에서 이름과 주요 행동을 읽을 수 있는지 확인해 주세요.
    큰 글씨의 좁은 화면에서 섹션 제목과 상태·도구가 별도 줄에 배치되고 최근 감상 메뉴가 겹치지 않는지 확인해 주세요.
    저작권 문제가 없는 짧은 음원으로 파일 가져오기, 메타데이터 확인, 작품·녹음·악장 등록과 재생을 확인해 주세요.
    홈·검색·음악 발견에서 작품 상세와 녹음 상세로 이동하고 악장 순서, 연주자와 파일 연결 상태를 확인해 주세요.
    여러 악장 파일을 한 작품으로 등록한 뒤 작품 랜덤 재생에서 순서대로 큐에 들어가는지 확인해 주세요.
    녹음 상세에서 전체 재생과 중간 악장부터 재생을 각각 실행해 남은 악장 순서가 유지되는지 확인해 주세요.
    앱을 다시 실행해 재생 위치, 감상 기록과 라이브러리가 유지되는지 확인해 주세요.
    재생 중 전체 로컬 데이터 초기화를 실행하면 재생과 큐가 비워지고 다시 실행해도 이전 큐·위치·이력이 되살아나지 않는지 확인해 주세요. 외부 원본은 유지되어야 합니다.
    재생 진단을 다시 실행하면 이전 청감 응답은 확인하지 않음으로 돌아갑니다. 자동 결과와 실제 청감 응답을 별도로 확인해 주세요.
    앱 정보 및 데이터에서 논리 백업을 내보내고 가져오기 preview를 확인해 주세요. 백업에는 음원과 원래 파일·폴더 경로가 포함되지 않으며 복원한 음원은 다시 연결해야 합니다.
    음원 정보·파일 복구에서 누락 파일의 대체 파일을 선택하고 일치 근거를 확인한 뒤 재연결해 기존 작품·교정·감상 상태가 유지되는지 확인해 주세요.
    저장소 준비 또는 스캔 실패 뒤 한국어 재시도 동작과 개인 파일 경로 비노출을 확인해 주세요.
    파일 앱 또는 iCloud Drive에서 가져오기, 스피커·유선·Bluetooth 출력과 interruption 동작도 가능한 범위에서 확인해 주세요.
    기기/OS/앱 버전, 음원 형식, 실행 순서, 기대 결과와 실제 결과를 피드백에 포함하되 파일 경로나 개인 메타데이터는 보내지 마세요.
    출시 후보 피드백 JSON은 제한된 기기 분류·OS major·fixture·결과·P0–P3만 기록하고 validator를 통과시켜 주세요. 파일명, 전체 경로, 곡 metadata, 기기 식별자와 native 오류 전문은 넣지 마세요.
