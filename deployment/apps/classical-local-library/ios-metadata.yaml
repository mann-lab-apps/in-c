  description: 로컬 음원을 가져와 곡 목록에서 바로 재생하고, 원하는 음원을 작품·녹음·악장으로 정리하는 흐름을 테스트합니다.
  test_notes: |-
    2026-11-11 미배포 후속: 곡 더보기에서 지금 재생/바로 다음/마지막 추가를 구분하고, 현재 재생 상세에서 미래 항목 이동·제거·남은 대기열 비우기와 일시정지·현재 위치 보존을 확인합니다. 곡/현재 재생의 즐겨찾기와 보관함 즐겨찾기 목록·재시작/백업 복원을 비교합니다. 작품이 없어도 IMSLP 검색→공식 페이지 확인→Files 저장→음원 가져오기→곡 보기/재생으로 이어져야 하며 출처는 별도 사용자 확인 후에만 저장합니다. 실제 Files/iCloud·잠금 청감·VoiceOver·전화·Bluetooth는 Xs 사용자 검수이며 fixture/native 상태 값으로 대체 통과하지 않습니다. 기존 내부0.1.0(4)는 새 기능을 포함하지 않습니다.
    2026-11-03 미배포 큐 모드: 전체 재생에서 셔플과 반복 끔→전체 반복→한 곡 반복을 조작합니다. 현재 곡·위치 유지, 실제 대기열 순서, 한 곡 반복 중 수동 이동, 일시정지 유지, 마지막 자연 종료, 완료 후 재생과 재시작 후 순서/선택 복원을 확인합니다. 기존 내부0.1.0(4)에는 이 기능이 없습니다. 물리 Xs 잠금·청감·시스템 버튼 검수는 새 후보가 제공된 뒤 별도 수행하며 이번 작업은 업로드하지 않습니다.
    2026-11-02 내부 빌드0.1.0(4): 이전 내부 빌드3 이후 보관함 메뉴·재생목록 생성 완료 안내/보기·검색/정렬·분류 편집·로컬 표지·대형 목록/복구·전체 검색 worker 개선을 포함합니다. Apple VALID/INTERNAL_ONLY, 기존 내부 그룹 연결 후 IN_BETA_TESTING을 확인했습니다. 곡 재생 중 빠른 검색·삭제·뒤로 복귀, 재생목록 생성 후 원래 화면 유지와 보기, 표지 선택과 누락 파일 복구를 확인해 주세요. 잠금/앱 전환 재생과 시스템 조작은 유지합니다. Xs 실제 청감·VoiceOver·Files/iCloud·대형 실사용 성능은 사용자 검수 대상입니다. 공개 출시·외부 테스트가 아닌 내부 테스트 전용 빌드입니다.
    2026-11-02 전체 검색 미배포: 내 음악 검색에서 빠른 입력·삭제, 준비 중 재생 조작, 오류 후 다시 검색과 화면 복귀를 확인합니다. 가져오기·교정·승인 후 이전 검색 결과가 남지 않아야 합니다. 상위 검색 제안12개와 전체 파일 결과를 구분하며 검색으로 큐·곡·위치를 바꾸지 않습니다. 현재 내부 0.1.0(3)은 이번 변경을 포함하지 않습니다. Xs 실사용 성능·청감은 사용자 검수 pending입니다.
    2026-10-31 대형 보관함 후속 미배포: 곡·앨범·아티스트·검색·재생목록을 길게 스크롤하고 재생 중 탐색·정렬·뒤로 복귀를 확인합니다. 화면 밖 곡까지 표시 순서대로 재생되고 편집은 저장한 수동 순서를 사용해야 합니다. 표지 저장 중 중단·손상 사본은 기본 표지와 재선택/재추출로 복구하며 원본은 변경하지 않습니다. host/simulator 합성 fixture 결과는 실제 Xs 성능·청감·Files 제공자 결과가 아닙니다.
    2026-10-31 후속 미배포 변경: 도구 더보기→보관함 분류 편집에서 표시·순서를 저장하고 재시작해 확인합니다. 모두 숨겨도 분류 편집으로 복구할 수 있습니다. 재생목록 목록과 상세의 검색·정렬을 사용하고, 정렬된 순서로 재생한 뒤 편집에서는 원래 저장 순서가 유지되는지 확인합니다. 정렬 설정은 재시작 후 유지하고 검색어는 방문 중에만 유지합니다. 상세 더보기의 표지 선택/제거는 이미지 관리 사본만 변경합니다. 논리 백업은 이미지 byte를 제외하므로 다른 설치에서 표지를 다시 선택할 수 있습니다. 미승인 경로 추론은 음악 정보로 표시하지 않습니다. iOS 뒤로 swipe 완료·취소와 큰 글자 보기/닫기를 확인합니다. 기존 내부 빌드 0.1.0(3)에는 포함되지 않습니다.
    후속 UX 미배포 변경: 태그·사용자 교정·승인된 후보를 구분하며 미승인 경로 추론은 감상 화면의 앨범/아티스트로 사용하지 않습니다. 보관함 내부 탐색을 실제 route로 전환해 iOS 뒤로 제스처 완료/취소와 이전 화면 복원을 검증합니다. 기존 배포 빌드의 동작으로 해석하지 마세요.
    2026-10-31 미배포 변경: 보관함 루트에만 전역 도구가 있고 상세 메뉴는 해당 대상에만 작용하는지 확인해 주세요. 상세→검색→뒤로에서 이전 목록/검색어/정렬/스크롤로 복귀해야 합니다. 새 재생목록 저장 후 원래 화면의 완료 안내에서 ‘보기’를 누를 때만 상세가 열려야 합니다. 현재 재생에서 생성 후 ‘보기’와 뒤로를 눌러도 큐·곡·위치가 유지되어야 합니다. 재생목록 상세의 더보기에서 편집/이름 변경/삭제를 사용합니다.
    0.1.0(3): 잠금 화면·제어센터의 곡명과 앱의 현재 곡이 일치하는지 확인해 주세요. 재생·일시정지·다음·이전·진행 위치를 조작한 뒤 앱 큐·위치와 비교하세요. 일시정지 중 곡 이동은 재생을 시작하지 않아야 합니다. 이전은 3초 이상이면 현재 곡 처음, 3초 미만이면 이전 곡으로 이동합니다. 진단 실행·실패·화면 닫기 후에도 본재생 큐·위치가 보존되고 자동 재개하지 않는지 확인하세요. 실제 iPhone Xs 시스템 버튼·잠금 청감은 사용자 QA 대상입니다.
    기존 잠금 재생 회귀: iPhone Xs에서 1분 이상 음원을 재생한 뒤 전원 버튼으로 화면을 잠그고 30초간 재생이 이어지는지 확인해 주세요. 잠금 중 다음 곡, 잠금 해제 후 큐·위치 유지, 직접 일시정지 후 자동 재생 방지, 전화/다른 오디오·헤드폰 분리 시 일시정지와 자동 재개 방지를 확인해 주세요.
    보관함의 재생목록에서 목록을 만든 뒤 검색으로 곡 두 개를 함께 선택해 추가하고, 편집에서 드래그로 순서를 바꿔 재생해 주세요. 곡·앨범·검색 결과의 더보기와 현재 재생에서도 재생목록에 담을 수 있습니다. 목록 삭제나 곡 제거로 원본 파일이 삭제되어서는 안 됩니다. 앱 재시작 후에도 목록과 순서가 유지되고 누락 곡은 목록에 남지만 재생에서는 건너뛰는지 확인해 주세요. 폴더별 보기는 도구 메뉴에 있습니다.
    보관함의 곡·앨범·아티스트·재생목록 행을 열어 목록 안 검색과 곡 정렬을 확인해 주세요. 재생 중 검색·정렬을 바꾸어도 큐와 현재 위치가 유지되고, 누락 파일은 파일 상태 확인으로 이어져야 합니다.
    빈 보관함에서 파일을 가져와 곡 목록에 표시되는지, 작품 등록 전에 바로 재생되는지 확인해 주세요. 축약 조작과 전체 재생 화면의 큐를 확인해 주세요.
    R3: 여러 파일 중 일부가 실패해도 완료한 곡이 남는지, 실패한 선택만 재시도되는지 확인해 주세요. 가져온 곡의 작품·녹음 정리를 취소하거나 저장 실패로 재시도해도 원본과 큐가 유지되어야 합니다. 등록 후 첫 재생 안내는 실제 재생 시작 뒤에만 나타납니다.
    앱 관리 복사본 내보내기 성공 뒤 연결 방법을 열어 파일 앱 보관→Score 악보 선택→연결 파일 추가의 수동 경로를 확인해 주세요. 공유 완료는 Score 저장 완료가 아닙니다.
    앨범·아티스트·재생목록 탐색과 내 음악 검색을 확인해 주세요. 폴더별 보기·클래식 정리·감상 기록·음악 발견·IMSLP는 상단 도구 더보기에서 접근합니다.
    R2: A 녹음 재생 중 검색으로 B 녹음을 열어도 A의 큐·악장·위치가 유지되는지 확인해 주세요. 넓은 화면 옆 재생 영역과 좁은 화면 하단 조작/재생 상세를 확인해 주세요.
    같은 녹음의 큐는 작품·녹음 맥락을 한 번 표시하며 혼합 큐는 구간별로 구분합니다. 음원 정보 N에서 파일명·출처를, 녹음 정보 열기에서 상세를 확인해 주세요. 재시도는 기존 큐 첫 악장부터 시작합니다.
    작품·녹음 검색·필터·정렬은 보관함 아래의 클래식 영역에서 확인해 주세요. 탐색·검색·테마 변경만으로 큐나 재생 위치가 초기화되면 안 됩니다.
    도구 메뉴의 가져오기·파일 상태에서 파일·폴더·요약을, 음원 정보·파일 복구에서 메타데이터·누락 파일 복구를, 감상 기록에서 이력·통계를 확인해 주세요. 재생의 오류 재시도와 길이 미확정 상태를 구분해 주세요.
    공통 quiet/secondary 버튼의 중립색과 선택 상태, 목록 선택 이름, 검색 입력과 기존 재생·queue 동선이 유지되는지 확인해 주세요.
    승인된 Play 아이콘 후보 08의 실제 런처 표시와 빈 보관함의 음악 가져오기 행동을 확인해 주세요. 실제 기기 렌더링과 스토어 스크린샷은 별도 검수입니다.
    큰 글씨·다크 모드에서 이름과 주요 행동을 읽을 수 있는지 확인해 주세요.
    큰 글씨의 좁은 화면에서 섹션 제목과 상태·도구가 별도 줄에 배치되고 최근 감상 메뉴가 겹치지 않는지 확인해 주세요.
    저작권 문제가 없는 짧은 음원으로 파일 가져오기, 메타데이터 확인, 작품·녹음·악장 등록과 재생을 확인해 주세요.
    홈·검색·음악 발견에서 작품 상세와 녹음 상세로 이동하고 악장 순서, 연주자와 파일 연결 상태를 확인해 주세요.
    여러 악장 파일을 한 작품으로 등록한 뒤 작품 랜덤 재생에서 순서대로 큐에 들어가는지 확인해 주세요.
    녹음 상세에서 전체 재생과 중간 악장부터 재생을 각각 실행해 남은 악장 순서가 유지되는지 확인해 주세요.
    앱을 다시 실행해 재생 위치, 감상 기록과 라이브러리가 유지되는지 확인해 주세요.
    재생 중 전체 로컬 데이터 초기화를 실행하면 재생과 큐가 비워지고 다시 실행해도 이전 큐·위치·이력이 되살아나지 않는지 확인해 주세요. 외부 원본은 유지되어야 합니다.
    재생 진단을 다시 실행하면 이전 청감 응답은 확인하지 않음으로 돌아갑니다. 자동 결과와 실제 청감 응답을 별도로 확인해 주세요.
    앱 정보 및 데이터에서 논리 백업을 내보내고 가져오기 preview를 확인해 주세요. 백업에는 음원과 원래 파일·폴더 경로가 포함되지 않으며 복원한 음원은 다시 연결해야 합니다.
