  notes: |-
    2026-10-26: Common blue theme: brand/icon background #A5D8FF, light action/focus #1971C2, dark action #A5D8FF. Informational banners use neutral info; success/warning/error keep semantic colors. Existing routes and permissions are unchanged; verify the new source in light/dark before review.
    띠로리 플레이 is a local-file classical music organizer and foreground audio player.
    No account or sign-in is required. The production app starts with an empty library.

    To review the primary local workflow, import a reviewer-owned WAV, M4A, MP3, FLAC, OGG or Opus
    file with "파일 가져오기" and the iOS document picker. The song should appear in the library
    without creating a work or recording. Tap the song to play it, then use the compact player
    to pause, skip or open the full player and queue. The library shows compact categories and
    recently added album/song tiles; an album tile opens its local song list. Open Songs to search within that list and
    use "곡 정렬" to change the order; this does not change the active playback queue. Album,
    artist and folder lists are optional. A missing file offers file status review, not playback.
    Classical organization is a separate, optional path under the top "도구 더보기" menu:
    choose "음원 정보·파일 복구", register the file as work/recording/movement, then use work and recording
    detail screens to play the complete recording or start from a selected movement.
    The import result separates imported, duplicate, analysis-pending, failed and cancelled files.
    Retry acts on failed selections only. From an imported file, open the full work/recording form;
    cancelling registration retains the imported file, and save failure retains the draft.
    If catalog persistence has completed but a follow-up step fails, retry the same draft; closing
    asks for confirmation that the saved catalog is not undone and reloads the library.
    The first-play message appears only after the player reports playing. Direct song playback
    remains available without classical registration.

    For a completed managed copy only, use "음원 정보·파일 복구" > the file's export action. After a supported
    audio copy is shared, "연결 방법" explains how to save it in Files, select a score in Ddirori
    Score and add it as a linked file there. Share success does not verify a Files save or a
    Score import. No cross-app direct transfer, account or synchronization is provided.

    While playback is active, browsing another work or recording does not replace the playing
    queue. Use the side playback area on wide layouts, or the bottom compact controls and
    "재생 상세 열기" on narrow layouts. File details are available via "음원 정보 N" in the queue.
    Retrying a playback failure reloads the retained queue and starts from its first item.

    For metadata editing, open "도구 더보기" > "음원 정보·파일 복구", then the file's "파일 작업" menu and
    "내부 메타데이터 편집". Cancel leaves existing values unchanged. Save stays in the
    dialog until persistence succeeds; a failure preserves the draft for retry.

    The "재생 진단" screen exercises bundled, self-generated WAV, AAC-in-M4A and ALAC-in-M4A
    fixtures without requiring copyrighted media. These fixtures are diagnostic assets and are not
    added to the user's music library.

    MusicBrainz and IMSLP are optional, user-initiated network features. MusicBrainz values are not
    applied without field-level confirmation. IMSLP pages and material rights must be reviewed by
    the user; the app does not scrape undocumented file links or bypass membership, waiting-period,
    CAPTCHA or regional restrictions.

    Audio playback is foreground-only. The app does not provide background playback, lock-screen
    controls, accounts, analytics, advertising or cloud synchronization. Original files and tags are
    never modified. A logical JSON backup can restore catalog and listening state, but deliberately
    excludes audio bytes and original file/folder paths. Restored or moved files must be relinked
    with explicit user confirmation. Storage startup and scan failures show a path-free Korean retry action.
    Privacy and support actions remain unavailable until approved public HTTPS URLs are injected.
    Verify these instructions and attach a copyright-safe review fixture before marking this section
    reviewed.
testflight:
