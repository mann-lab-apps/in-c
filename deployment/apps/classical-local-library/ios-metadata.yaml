  description: 로컬 클래식 음원을 작품·녹음·악장으로 정리하고, 악장 순서를 유지한 재생과 감상 기록을 테스트합니다.
  test_notes: |-
    재생 삼각형의 새 아이콘과 제품 소개 문구, 빈 라이브러리의 바흐 안내를 확인해 주세요.
    큰 글씨·다크 모드에서 이름과 주요 행동을 읽을 수 있는지 확인해 주세요.
    큰 글씨의 좁은 화면에서 섹션 제목과 상태·도구가 별도 줄에 배치되고 최근 감상 메뉴가 겹치지 않는지 확인해 주세요.
    저작권 문제가 없는 짧은 음원으로 파일 가져오기, 메타데이터 확인, 작품·녹음·악장 등록과 재생을 확인해 주세요.
    홈·검색·음악 발견에서 작품 상세와 녹음 상세로 이동하고 악장 순서, 연주자와 파일 연결 상태를 확인해 주세요.
    여러 악장 파일을 한 작품으로 등록한 뒤 작품 랜덤 재생에서 순서대로 큐에 들어가는지 확인해 주세요.
    녹음 상세에서 전체 재생과 중간 악장부터 재생을 각각 실행해 남은 악장 순서가 유지되는지 확인해 주세요.
    앱을 다시 실행해 재생 위치, 감상 기록과 라이브러리가 유지되는지 확인해 주세요.
    재생 중 전체 로컬 데이터 초기화를 실행하면 재생과 큐가 비워지고 다시 실행해도 이전 큐·위치·이력이 되살아나지 않는지 확인해 주세요. 외부 원본은 유지되어야 합니다.
    재생 진단을 다시 실행하면 이전 청감 응답은 확인하지 않음으로 돌아갑니다. 자동 결과와 실제 청감 응답을 별도로 확인해 주세요.
    앱 정보 및 데이터에서 논리 백업을 내보내고 가져오기 preview를 확인해 주세요. 백업에는 음원과 원래 파일·폴더 경로가 포함되지 않으며 복원한 음원은 다시 연결해야 합니다.
    파일 정리에서 누락 파일의 대체 파일을 선택하고 일치 근거를 확인한 뒤 재연결해 기존 작품·교정·감상 상태가 유지되는지 확인해 주세요.
    저장소 준비 또는 스캔 실패 뒤 한국어 재시도 동작과 개인 파일 경로 비노출을 확인해 주세요.
    파일 앱 또는 iCloud Drive에서 가져오기, 스피커·유선·Bluetooth 출력과 interruption 동작도 가능한 범위에서 확인해 주세요.
    기기/OS/앱 버전, 음원 형식, 실행 순서, 기대 결과와 실제 결과를 피드백에 포함하되 파일 경로나 개인 메타데이터는 보내지 마세요.
    출시 후보 피드백 JSON은 제한된 기기 분류·OS major·fixture·결과·P0–P3만 기록하고 validator를 통과시켜 주세요. 파일명, 전체 경로, 곡 metadata, 기기 식별자와 native 오류 전문은 넣지 마세요.
