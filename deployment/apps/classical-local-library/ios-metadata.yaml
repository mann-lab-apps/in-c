review:
  reviewed: false
  demo_account_required: false
  notes: |-
    Ddirori Play is a local audio manager/player. No account/subscription is required. Production launch starts with an empty library; sample music is not automatically added.
    Import rights-cleared audio using Files, open Songs, and tap a song to play. Work/Recording registration is optional. Browse Songs/Albums/Composers/Playlists and use multi-select, play-next/append, favorites and playlist actions. Successful playlist creation stays on the source screen with an explicit View action.
    Now Playing reflects the actual engine and queue. Pause/seek/previous/next, shuffle/repeat and queue selection share one controller. Screen lock/app switching alone does not pause iOS playback. Interruption or route loss pauses without automatic resume. Relaunch restores state without autoplay.
    Optional tools manage composer names/confirmed aliases, works/recordings/movements, uncertain eras and official IMSLP work-page links. Search results are not downloadable audio lists or rights approval. External searches are user-initiated. Original tags/media are not modified.
    Settings opens https://ddirori.com/play/privacy/ and https://ddirori.com/support/. Operator: 만랩. No in-app account, advertising or analytics SDK; website analytics are separate. Logical backups omit audio/original paths and require relinking. Legacy nonportable backups must be re-exported from the source library.
    First public target is1.0.0. Build5 was selected after reading all existing Apple builds/uploads1-4, complete with no further pages. Actual new upload acceptance, candidate/device QA and media review are pending. Simulator or injected-picker tests are not physical audibility, Files-provider, VoiceOver or Bluetooth approval.
