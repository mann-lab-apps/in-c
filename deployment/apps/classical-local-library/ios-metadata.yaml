  locales:
    ko:
      name: 띠로리 플레이
      subtitle: 내 음악을 가져오고 바로 재생
      description: |-
        내 음악을 가져와 바로 듣고, 원하는 방식으로 보관하세요.

        띠로리 플레이는 기기에 보관한 음원을 관리하고 재생하는 음악 플레이어입니다. 작품을 등록하기 전에도 파일 앱에서 가져온 곡을 바로 들을 수 있습니다.

        익숙한 내 음악 보관함
        • 곡·앨범·작곡가·재생목록으로 탐색
        • 보관함 검색과 목록 정렬, 최근 추가한 음악 확인
        • 재생목록 만들기·곡 추가·순서 편집과 즐겨찾기
        • 여러 곡을 함께 선택해 재생하거나 대기열에 예약

        이어지는 감상
        • 축약 플레이어와 전체 재생 화면
        • 이전·다음 곡, 진행 위치, 셔플·한 곡/전체 반복
        • 화면 잠금과 앱 전환 중 재생 유지
        • 잠금 화면·제어센터에서 곡 정보와 재생 조작
        • 큐·재생 위치 복원과 감상 기록
        앱을 다시 열거나 오디오 중단이 끝났다는 이유만으로 자동 재생하지 않습니다.

        클래식 음원도 차근차근
        • 작곡가의 한글·원어 이름과 확인한 별칭 관리
        • 작품·녹음·악장을 구분하고 악장 순서대로 감상
        • 출처와 추정 여부를 구분하는 시대별 탐색
        • MusicBrainz 후보를 확인하고 선택한 정보만 반영
        • IMSLP 공식 작품 페이지 검색과 참조 연결
        IMSLP 검색 결과는 다운로드 가능한 음원 목록이나 저작권 승인을 뜻하지 않습니다.

        데이터를 내 손으로
        원본 음원과 태그는 수정하지 않습니다. 카탈로그·재생목록·감상 기록을 논리 백업으로 내보내고 복원할 수 있습니다. 논리 백업은 음원 내용과 원래 경로를 포함하지 않으므로 복원 후 실제 파일을 다시 연결해야 합니다.

        앱 내부에 회원가입·광고·분석 SDK는 없습니다. 자료는 기본적으로 기기에 저장되며 외부 검색·공식 페이지 열기는 사용자가 선택합니다. 외부 서비스에는 인터넷 연결과 해당 서비스의 이용 조건이 적용됩니다.
      keywords: 클래식,음악플레이어,로컬음원,음원관리,악장,작품,녹음,감상이력,IMSLP,MusicBrainz
      promotional_text: 내 음원을 가져와 곧바로 듣고, 원할 때 작품·녹음·악장으로 정리하세요.
      support_url: https://ddirori.com/support/
      marketing_url: https://ddirori.com/play/
      privacy_url: https://ddirori.com/play/privacy/
      release_notes: |-
        내 음원을 가져와 바로 재생하고 곡·앨범·작곡가·재생목록으로 정리할 수 있습니다.
        즐겨찾기·대기열 예약·셔플/반복과 잠금 화면 재생 조작을 제공합니다.
        원하면 작품·녹음·악장과 시대 정보를 정리하고 공식 IMSLP 작품 페이지를 연결할 수 있습니다.
        논리 백업은 음원 내용을 포함하지 않으며 복원 후 파일을 다시 연결해야 합니다. 개인 경로가 포함된 이전 비정상 백업은 최신 앱의 원본 라이브러리에서 다시 내보내 주세요.
