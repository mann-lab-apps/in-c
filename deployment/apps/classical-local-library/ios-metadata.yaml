      name: 띠로리 플레이
      subtitle: 내 음악을 가져오고 바로 재생
      description: |-
        띠로리 플레이는 내가 가진 음원을 가져와 바로 듣고, 원할 때 클래식 작품으로 정리하는 로컬 음악 플레이어입니다.

        iPhone 또는 iPad의 파일 앱에서 음원을 가져오면 보관함의 곡 목록에서 바로 재생할 수 있습니다. 곡·앨범·아티스트·재생목록으로 탐색하고 목록 안에서 검색하거나 곡을 정렬하세요. 곡·앨범·현재 재생에서 재생목록에 담고, 여러 곡을 고르거나 순서를 바꿔 들을 수 있습니다. 폴더별 보기는 도구 메뉴에서 이용할 수 있습니다. 최근 추가한 앨범과 곡도 확인할 수 있습니다. 클래식 작품으로 정리하는 과정은 선택 사항입니다.

        가져오기 결과에서 파일별 성공·중복·분석 대기·실패를 확인하고 실패한 파일만 다시 시도할 수 있습니다. 원한다면 가져온 파일을 작품·녹음·악장으로 정리하세요. 앱 관리 음원을 내보낸 뒤에는 띠로리 Score에서 악보와 음원을 수동으로 연결하는 방법을 확인할 수 있습니다. 앱 간 자동 전송이나 저장 확인은 제공하지 않습니다.

        클래식 중심 라이브러리
        • 가져온 파일을 작품 등록 없이 바로 재생하고 보관함에서 검색
        • 작곡가, 작품, 녹음, 악장과 로컬 파일을 구분해 관리
        • 작품 상세에서 악장과 보유 녹음을 살펴보고 녹음 상세에서 연주자와 파일 상태 확인
        • 작품 번호, 한글·원어 이름과 별칭 검색
        • 파일 태그와 파일명에서 메타데이터 후보 확인
        • 앱 내부 메타데이터 교정과 중복 작품·녹음 정리

        작품을 지키는 재생
        • 작품, 녹음 또는 악장 단위의 랜덤 재생
        • 분리된 악장을 순서대로 묶은 재생 큐
        • 녹음 전체 또는 선택한 악장부터 남은 악장을 순서대로 재생
        • 다른 작품과 녹음을 살펴보는 동안 현재 재생 조작에 접근
        • 큐의 작품·녹음 맥락을 묶어 보고 개별 악장과 음원 정보 확인
        • 재생 위치 저장과 이어 듣기
        • 최근 감상 기록과 작품·녹음별 감상 통계
        • 음원과 원래 폴더 경로를 제외한 라이브러리 백업·복원
        • 이동하거나 누락된 음원을 사용자 확인 후 기존 작품에 다시 연결

        내 라이브러리에서 다시 발견하기
        • 같은 작곡가의 다른 작품과 같은 작품의 다른 녹음 탐색
        • 최근 감상과 보유 메타데이터를 바탕으로 한 기기 내 추천
        • MusicBrainz 후보를 확인한 뒤 선택한 필드만 반영
        • 로컬 작품과 공식 IMSLP 작품 페이지 연결

        음원, 파일 정보, 카탈로그와 감상 기록은 기본적으로 기기에 저장됩니다. 계정, 광고 또는 분석 SDK를 사용하지 않으며 원본 음원과 원본 태그를 수정하지 않습니다.

        현재 재생은 앱이 실행 중인 동안 지원합니다. 외부 서비스 검색과 자료 확인에는 인터넷 연결이 필요할 수 있습니다.
