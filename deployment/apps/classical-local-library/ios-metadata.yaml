    1. Import a rights-cleared MP3/FLAC/M4A using Files; check cancellation/duplicates and immediate song playback without Work registration.
    2. Pause/seek/previous/next, queue selection, playlists/favorites and browsing while playing.
    3. Lock30 seconds and compare queue/position on return. Check available output routes and interruption/route loss; do not auto-resume.
    4. Check large text/VoiceOver, app version, privacy/support links, relaunch and existing data.
    5. Optional composer/era/IMSLP paths require user confirmation; no automatic download or rights approval.
    Reply passed/issue/notChecked with the exact candidate version/build. Never send private media, filenames, paths or account/device identifiers. Candidate receipt binding is separate from feedback JSON; automated declarations do not fill physical observations.
