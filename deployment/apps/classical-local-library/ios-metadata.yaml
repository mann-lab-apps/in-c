    ko:
      name: 띠로리 플레이
      subtitle: 내 음원을 작품과 악장으로
      description: |-
        띠로리 플레이는 내가 가진 음원을 클래식 음악의 구조로 정리하고 감상하는 로컬 음악 플레이어입니다.

        iPhone 또는 iPad의 파일 앱에서 음원을 가져와 작곡가, 작품, 녹음과 악장 순서로 정리하세요. 여러 파일로 나뉜 교향곡과 소나타도 하나의 작품 또는 녹음으로 묶어 순서대로 재생할 수 있습니다.

        클래식 중심 라이브러리
        • 작곡가, 작품, 녹음, 악장과 로컬 파일을 구분해 관리
        • 작품 상세에서 악장과 보유 녹음을 살펴보고 녹음 상세에서 연주자와 파일 상태 확인
        • 작품 번호, 한글·원어 이름과 별칭 검색
        • 파일 태그와 파일명에서 메타데이터 후보 확인
        • 앱 내부 메타데이터 교정과 중복 작품·녹음 정리

        작품을 지키는 재생
        • 작품, 녹음 또는 악장 단위의 랜덤 재생
        • 분리된 악장을 순서대로 묶은 재생 큐
        • 녹음 전체 또는 선택한 악장부터 남은 악장을 순서대로 재생
        • 재생 위치 저장과 이어 듣기
        • 최근 감상 기록과 작품·녹음별 감상 통계
        • 음원과 원래 폴더 경로를 제외한 라이브러리 백업·복원
        • 이동하거나 누락된 음원을 사용자 확인 후 기존 작품에 다시 연결

        내 라이브러리에서 다시 발견하기
        • 같은 작곡가의 다른 작품과 같은 작품의 다른 녹음 탐색
        • 최근 감상과 보유 메타데이터를 바탕으로 한 기기 내 추천
        • MusicBrainz 후보를 확인한 뒤 선택한 필드만 반영
        • 로컬 작품과 공식 IMSLP 작품 페이지 연결

        음원, 파일 정보, 카탈로그와 감상 기록은 기본적으로 기기에 저장됩니다. 계정, 광고 또는 분석 SDK를 사용하지 않으며 원본 음원과 원본 태그를 수정하지 않습니다.

        현재 재생은 앱이 실행 중인 동안 지원합니다. 외부 서비스 검색과 자료 확인에는 인터넷 연결이 필요할 수 있습니다.
      keywords: 클래식,음악플레이어,로컬음원,음원관리,악장,작품,녹음,감상이력,IMSLP,MusicBrainz
