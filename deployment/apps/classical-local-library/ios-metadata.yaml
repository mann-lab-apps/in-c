      release_notes: |-
        미배포 안정성 개선: 즐겨찾기 저장 성공 후 새로고침 실패를 구분하고, 목록 재조회만 다시 시도하도록 개선했습니다. 재생 오류의 재시도 동작을 명확히 안내하고 비식별 피드백에서 자동 검사와 사용자 확인을 구분합니다.
        미배포 후속 변경: 현재 큐의 예약·미래 항목 편집과 file ID 기반 즐겨찾기를 추가하고, 작품 등록 없는 IMSLP 탐색에서 Files 음원 가져오기·곡 확인·명시적 재생으로 이어지도록 개선했습니다. 기존 내부 TestFlight0.1.0(4)에는 이 변경이 없습니다.
        미배포 개발 변경: 현재 큐 셔플과 한 곡·전체 반복, 원래 순서 복구와 재시작 후 모드·선택 복원을 추가했습니다. 수동 이동은 한 곡 반복을 무시하고 일시정지 상태를 유지합니다. 이 변경은 기존 내부 TestFlight0.1.0(4)에 포함되지 않았습니다.
        전체 검색의 준비 정보를 재사용하고 큰 보관함의 검색 계산을 분리했습니다. 최신 입력과 음원 정보 변경만 결과에 반영하며 검색 준비·실패·재시도를 안내합니다. 검색과 화면 이동은 재생 큐와 위치를 바꾸지 않습니다.
        많은 곡과 재생목록의 스크롤·검색 중 갱신 비용을 줄이고, 중단되거나 손상된 표지 사본의 복구를 개선했습니다. 정렬된 전체 곡 재생과 저장한 수동 순서는 유지됩니다.
        재생목록 검색·정렬, 보관함 분류 편집과 로컬 표지를 추가했습니다. 태그·사용자 교정·승인 정보로 표시하며 iOS 뒤로 제스처와 큰 글자 완료 안내를 개선했습니다. 음악·목록과 재생 상태는 유지됩니다.
        보관함의 전역 도구와 상세별 메뉴를 나누고 검색·목록 복귀 시 이전 탐색 위치를 유지합니다. 재생목록 생성·추가 후 원래 화면에 완료 안내를 표시하고 ‘보기’로 상세를 엽니다. 저장 실패 시 입력을 유지하며 저장 후 새로고침 실패를 중복 생성으로 이어지지 않게 처리합니다.
        iOS 잠금 화면·제어센터에 곡 정보와 재생 조작을 연결하고 이전 곡 버튼을 추가했습니다. 일시정지 중 곡 이동은 재생을 시작하지 않으며, 진단 실행은 본재생을 일시정지하고 큐·위치를 보존합니다.
        iOS에서 화면 잠금·앱 전환 중 재생을 이어가고 현재 위치를 저장하도록 변경했습니다. interruption과 헤드폰 분리 시 일시정지하고 자동 재개하지 않는 정책은 유지합니다.
        재생목록을 만들고 곡·앨범·현재 재생에서 바로 담을 수 있습니다. 여러 곡을 한 번에 고르고 편집 화면에서 드래그로 순서를 바꿔 재생하세요. 파일이 누락되면 목록에는 남기고 재생할 때 건너뜁니다. 폴더별 보기는 도구 메뉴로 이동했고, 가져오기·파일 상태와 음원 정보·파일 복구 도구의 이름을 명확히 했습니다.
        공통 블루 테마로 아이콘 배경과 주요 동작·선택·포커스 색을 통일하고, 일반 안내는 중립색으로 구분했습니다.
        보관함 첫 화면을 큰 제목, 간결한 분류 목록과 최근 추가한 앨범·곡 카드로 정리하고 제목 위 앱 아이콘·이름은 제거했습니다. 런처에는 승인된 띠로리 플레이 아이콘을 적용했습니다.
        곡·앨범·아티스트 목록 안 검색과 곡 정렬을 추가했습니다. 누락 파일은 파일 상태 확인으로 연결하고, 검색·정렬 중 재생 큐를 유지합니다.
        보관함에서 곡·앨범·아티스트·재생목록을 탐색하고 가져온 파일을 정리 없이 바로 재생할 수 있습니다. 폴더별 보기는 도구 메뉴에서 접근합니다. 재생 중 축약 조작에서 상세와 큐를 열 수 있습니다.
        클래식 정리와 감상 기록, 음악 발견, IMSLP는 상단 도구에서 선택해 이용할 수 있습니다.
        녹음 탐색 중에도 현재 재생을 조작할 수 있습니다. 넓은 화면은 별도 재생 영역을, 좁은 화면은 하단 축약 조작과 재생 상세를 제공합니다.
        큐의 반복 작품·녹음 설명을 줄이고 악장 순서와 현재 항목을 명확히 표시했습니다. 음원 정보와 녹음 상세는 계속 확인할 수 있습니다.
        공통 보조 버튼의 중립색과 선택 표현을 정리하고, 입력 확정 및 선택 항목의 접근성 이름을 보완했습니다.
        내부 메타데이터 저장이 실패하면 입력을 유지하고 다시 시도할 수 있습니다. 저장 중 중복 실행을 막고 완료 후 목록으로 돌아갑니다.
        가져온 파일의 결과를 개별로 확인하고 실패 파일만 다시 시도할 수 있습니다. 선택한 파일은 작품·녹음 정리로 이어지고 등록 실패 시 입력을 보존합니다. 실제 재생 상태 확인 후 첫 재생을 알립니다.
        작품 등록 후 후속 처리만 실패한 경우 같은 입력으로 재시도하거나, 이미 저장된 내용은 취소되지 않는다는 확인 뒤 화면을 닫고 보관함을 다시 확인할 수 있습니다.
        내보낼 수 있는 앱 관리 음원은 공유 성공 뒤 띠로리 Score에 수동으로 연결하는 방법을 안내합니다. 공유만으로 Score 저장이 완료되지는 않습니다.
