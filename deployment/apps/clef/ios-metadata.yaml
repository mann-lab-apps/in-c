    - action: tap
      by: tooltip
      value: 여러 악보 선택
    - action: scroll_to
      by: text
      value: Prelude
      delta: 300
    - action: tap
      by: text
      value: Prelude
    - action: tap
      by: text
      value: 일괄 편집
    - action: wait
