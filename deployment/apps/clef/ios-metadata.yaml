    - 오디오 품질을 검증했다고 오인할 수 있는 표시
    - 연결 오디오 사용 중 엔진 확인 경고 (별도 QA 대상)
    - 이전 색조가 들어간 바탕의 캡처 또는 팔레트 비교용 웹 데모 화면
    - 이전 굵은 선택 밑줄·중첩 외곽선 UI, 글자나 조작부가 잘린 화면, 웹 컴포넌트 예제
    - 시스템 기준 검증용 웹 화면 또는 서로 다른 디자인 버전이 혼재한 화면
    steps:
    - action: tap
      by: text
      value: Prelude
    - action: wait
      milliseconds: 5000
    - action: tap
      by: text
      value: 주석
    - action: wait
      milliseconds: 400
    assertions:
    - by: widget_type
      value: PdfViewer
      present: true
    - by: widget_type
      value: ScoreAnnotationSummary
      present: true
    - by: text
      value: 연습
      present: true
    - by: tooltip
      value: 다음 페이지
      present: true
    - by: text
      value: A-B 반복
      present: false
    - by: text
      value: '연결 오디오 사용 중: 재생을 정지한 뒤 엔진 확인을 다시 실행하세요.'
      present: false
    - by: text
      value: 띠로리 색상 작업실
      present: false
    - by: widget_type
      value: ErrorWidget
      present: false
    - by: text
      value: 디자인 시스템 기준
      present: false
