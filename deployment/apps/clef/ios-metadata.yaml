review:
  reviewed: false
  demo_account_required: false
  notes: |-
    Ddirori Score (띠로리 스코어, formerly Clef & Staff) is a sheet-music library and reader.
    The local display name and icon have changed; account, bundle ID and backup keys are unchanged.
    Check the new library header, search, empty/loading/error states in light and dark mode.
    The active library precedes search. Quick access and category browsing are collapsed initially.
    Select scores, change filters, then open the bottom bulk-edit action; hidden selected scores remain included.
    Cancel returns focus to the action. Save failure retains the draft and original data; retry publishes changes only after persistence succeeds.
    The viewer separates reading/annotation input, the practice launcher, and performance restrictions. Annotation options retain all existing tools and palettes in a sheet; the page footer and Restore Tools remain reachable when chrome is hidden.
    Open an owned PDF, select Annotation, open pen options, draw, undo/redo, open and cancel Practice, enter/exit Performance, then hide and restore tools. Existing PDF coordinates, crop and page mapping are preserved.
    Open Practice → Metronome. Confirm Start/Stop, BPM increase/decrease, meter selection and click sound remain reachable on a short sheet. Automated tests cover the UI/settings path only; check actual click timing and output on the candidate device.
    While an annotation write is pending, Back and duplicate drawing are blocked. Failed writes retain the published layer and expose Retry; a successful retry updates the layer. Older document callbacks must not change a replacement document.
    Existing version/build fields describe the earlier candidate; reconcile with the exact product checkpoint before pinning.
    Verify these instructions against the exact iOS release build before marking them reviewed.

    Import the self-authored sample PDF using the add-score action and the system file picker.
    Confirm the score appears only after metadata storage succeeds, then open it, add a short annotation, return to the library, and add the score to a setlist.
    Studio projects and MusicXML are not PDF imports. For a Studio score, export a PDF and choose that file in Score. Attach an owned audio copy only after selecting the target score; file selection support does not prove codec playback on this device.
    Use the app's export/share action to inspect an exported copy or backup.
    No demo account is required for this local workflow.

    Attach an owned local audio file to a score, set an A-B loop and start playback.
    Close the audio panel while the loop save is pending; it must not start playback after closing.
    Repeat play/stop and retry after a save failure. Real output and loop timing need device verification.
    While saving/deleting a named loop or clearing the loop, playback must remain disabled until saving finishes.
    A failed stop keeps Stop available for retry. Device diagnostics distinguish stop errors or unavailable status from success.
    Close and reopen linked audio, then play again. Older cleanup must not interrupt the current track.
    The engine check warns when linked audio is in use instead of replacing it. Stale position captures must not change A-B values.
    These ownership cases have Dart regression coverage; verify actual output on the exact candidate build.
    Open Practice → Linked audio → an owned audio copy. Confirm its filename, waiting/playing/failure status and Play/Stop action are clear without exposing the app sandbox path. Check codec, speaker/wired/Bluetooth output, VoiceOver and large text on the candidate device separately.

    If microphone or external pedal functionality is advertised in this build, attach the verified
    physical-device demonstration and describe setup, permissions, expected results and limitations.
testflight:
  reviewed: false
  feedback_email:
  build_id:
  description: 띠로리 스코어(이전 Clef & Staff)의 PDF 악보 가져오기, 라이브러리 정리, 악보 보기와 주석, 세트리스트를 테스트합니다.
  test_notes: |-
    세트리스트 → 새 세트리스트에서 이름 입력 후 취소와 저장을 각각 확인해 주세요. 두 경우 모두 입력 창이 닫힌 뒤 세트리스트 화면이 정상적으로 유지되어야 합니다.
    기존 앱 저장소의 PDF·연결 파일·파일형 주석 사본을 복원한 뒤 악보와 연결 음원을 다시 열어 보세요. 앱 관리 폴더에 실제로 존재하는 같은 파일만 새 경로로 복구해야 하며, 외부 원본 경로 또는 다른 악보의 파일은 바꾸지 않아야 합니다.
    R2 확인: 실제 PDF 열기 → 주석 → 펜 옵션 → 필기/undo/redo → 연습 도구 열기/닫기 → 공연 진입/종료 → 도구 숨김/복원 → 페이지 이동. 도구 옵션은 기존 색·굵기·스탬프·텍스트를 유지합니다. 3쪽 PDF와 긴 스캔형 PDF, 가로화면/200% 글자에서 확인해 주세요.
    연습 → 메트로놈을 열어 시작/정지, BPM ±, 박자 선택, tick 소리가 짧은 화면에서도 스크롤로 모두 접근되는지 확인해 주세요. 실제 click 균일성·출력 route·Bluetooth/유선 latency는 별도 Device QA로 기록해 주세요.
    악보 도구 → 자동 스크롤을 열어 시작/일시정지/재개/정지, 페이지 범위, pause marker·반복 구간·cue point를 확인해 주세요. 390px 폭과 큰 글씨에서 긴 동작이 넘치지 않는지, 실제 스크롤 속도·cue 경계·터치/페달/VoiceOver는 별도 Device QA로 기록해 주세요.
    자동 스크롤에서 끝 페이지를 바꾸고 닫은 뒤 다시 열어 값이 유지되는지 확인해 주세요. 390/840px·가로·200% 글자에서 아래쪽 cue 설정까지 스크롤로 접근하고, 설정 창을 여닫을 때 PDF와 현재 쪽이 유지되는지 확인해 주세요.
    자동 스크롤의 현재 시작 큐를 다시 눌러도 오류 없이 같은 선택이 남아야 합니다. 0초/3초를 선택하고 재선택해 확인해 주세요.
    자동 스크롤 실행 후 악보 도구 → 자동 스크롤을 다시 열어 같은 창에서 일시정지 → 재개 → 정지를 확인해 주세요. 시작 큐 중에는 정지로 취소할 수 있어야 합니다. 저장 실패 시 설정을 유지하고 재시도하며, 저장을 기다리는 중 닫은 창이 나중에 스크롤을 시작하거나 새 설정 창을 닫지 않아야 합니다.
    느린 자동 스크롤 설정 저장 중 닫기 → 재진입 → 다른 값으로 변경 후 최신 값이 유지되는지 확인해 주세요. 시작한 쓰기의 강제 취소나 라이브러리 전환 중 모든 자료 쓰기 복구를 보장하는 기능은 아닙니다.
    악보함 → 악보 추가에서 PDF/이미지 선택과 취소·Back을 확인해 주세요. 큰 글자·가로 화면에서 아래쪽 선택지에 접근하며 파일 선택 취소나 가져오기 실패 후 기존 악보·검색 조건이 유지되어야 합니다.
    모든 도구 → 보기 옵션 → 공연 설정에서 변경 후 취소와 저장을 확인해 주세요. 저장 중 Back/닫기와 중복 저장을 막고 실패하면 설정을 유지한 채 다시 시도할 수 있어야 합니다. 실제 공연 모드 권한·화면 유지 품질은 별도로 확인해 주세요.
    공연 preset의 현재 설정 저장/삭제는 최종 공연 설정 저장과 별도입니다. 저장 중 입력·중복 동작·닫기가 막히고, 실패하면 이름/설정/기존 목록과 오류가 남아 해당 동작을 다시 시도할 수 있어야 합니다.
    공연 준비 안내에서 아래쪽 다시 보지 않기와 취소/시작에 접근해 주세요. 시작 뒤 짧은 전환 알림이 표시돼도 공연 종료를 누를 수 있어야 합니다. 실제 시스템 바 숨김·화면 유지·VoiceOver는 기기에서 별도로 확인해 주세요.
    공연 준비 설정 저장 중 뒤로 나가면 늦은 응답이 시스템 UI를 공연 모드로 바꾸지 않아야 합니다. 실제 저장/전환 오류가 발생하면 현재 상태를 유지하고 안내의 다시 시도로 재개할 수 있어야 합니다. 자동 channel 거부 fixture는 기기 시스템 바 검증을 대신하지 않습니다.
    라이브러리 전환 창에서 긴 이름·현재 상태·관리 메뉴를 확인해 주세요. 이름 변경/비우기 취소는 실제 전환이나 악보 열기를 실행하지 않고 검색·자료를 유지해야 합니다. 새 라이브러리 만들기 취소와 다른 라이브러리 전환 후 기본 자료로 복귀도 확인해 주세요.
    악보함 정렬에서 현재 정렬·가져온 날짜 등 하단 항목·취소에 큰 글자/가로로 접근해 주세요. 선택 후 검색/즐겨찾기 필터와 자료가 유지되고, 다른 라이브러리로 바뀐 뒤 이전 선택이 새 저장소에 적용되지 않아야 합니다.
    연습 → 튜너를 열어 마이크 시작/정지와 프리셋·악기/표시·감지 프로필·드론 선택값이 작은 폭에서 잘리지 않는지 확인해 주세요. 실제 권한·음정 정확도·노이즈·드론 출력·Bluetooth/유선 latency는 별도 Device QA로 기록해 주세요.
    메트로놈의 소리를 끄고 시작/정지·재시작 뒤 sheet를 닫았다가 다시 열어 정지 상태와 저장된 BPM·박자가 유지되는지 확인해 주세요. 튜너는 이름 있는 마이크 버튼과 아래쪽 기준음/드론까지 스크롤 접근을 확인해 주세요.
    첫/마지막·숨김 페이지와 세트리스트 안에서 이전/다음이 실제로 가능한 경우에만 활성화되는지, 읽기·주석·연습·공연 상태 문구가 함께 보이는지 확인해 주세요.
    모든 도구 → 보기 옵션 → 페이지 탐색에서 쪽 번호·슬라이더는 PDF를 즉시 옮기지 않고 이동을 눌러야 반영되어야 합니다. 범위 밖/숨김 쪽 오류, 처음/현재/끝/10쪽 이동과 표시 지점을 확인하고 취소 시 현재 PDF 쪽이 유지되는지 확인해 주세요.
    PDF 본문 검색에서 실제 PDF 내부 텍스트를 검색해 결과·이전/다음·지우기·닫기를 확인해 주세요. 스캔/OCR 검색은 새로 지원하지 않습니다. 큰 글자와 숫자/한글 키보드·가로 화면에서 조작부에 접근하고, 문서가 바뀌면 오래된 검색 화면이 이동을 실행하지 않는지 확인해 주세요.
    공연 모드에서 북마크·자동 스크롤·메트로놈·튜너와 세트리스트 이전/다음 곡 동작이 기존 권한대로 보이는지, 자동 스크롤 카운트다운이 도구와 악보를 가리지 않는지 확인해 주세요.
    PDF의 jump point·리허설 마크·북마크가 빠른 이동 도구와 overflow 메뉴에서 올바른 페이지로 이동하는지 확인해 주세요.
    자르기 맞춤에서 네 방향 값을 바꾸고 초기화/저장해 보세요. 원본 PDF는 바뀌지 않고 현재 뷰어의 여백만 갱신되어야 합니다.
    자르기 설정을 취소하면 기존 값이 남고, 저장 중에는 조정·초기화·닫기가 막혀야 합니다. 저장 실패 시 값을 유지하고 다시 시도하며, 성공 후에만 뷰어 맞춤과 완료 안내를 실행합니다. 휴대폰·태블릿 모두 모든 도구 → 보기 옵션에서 접근할 수 있습니다.
    보기 옵션의 Crop preset과 페이지 템플릿에서 적용·삭제·빈 페이지 위치 기록을 구분해 주세요. 프리셋 이름 입력을 취소해도 오류가 없어야 합니다. PDF 공유의 파일 선택을 취소하면 공유하지 않고, 텍스트 주석은 텍스트 도구로 눌러 수정·삭제할 수 있어야 합니다.
    PDF를 삭제하거나 손상된 파일을 열어 파일 상태 안내가 보이는지 확인하고, 진단 정보를 열어 경로/오류를 확인한 뒤 다시 가져오기 또는 백업 복구 안내를 따라가 보세요.
    주석 옵션에서 펜·형광펜·지우개·스탬프, 색·굵기, layer 표시/내보내기, undo/redo와 즐겨찾기 도구가 모두 접근 가능한지 확인해 주세요.
    주석 저장 중 중복 입력/Back 차단, 실패 안내/다시 저장과 원본 PDF 보존을 확인해 주세요. 자동 PDFium 위젯 검증은 실제 iOS 기기·펜·페달·VoiceOver 또는 스토어 촬영 검수가 아닙니다.
    R1 확인: 라이브러리 전환 → 검색 → 정렬/필터 → 접힌 빠른 접근 순서를 확인해 주세요. 선택 후 필터를 바꾸면 필터 밖 선택 개수와 하단 일괄 편집 버튼이 유지됩니다. 저장 중 Back·중복 적용 차단, 실패 시 원본/입력/선택 보존, 취소/성공 후 포커스 복귀를 확인해 주세요.
    분류가 있는 라이브러리에서 분류별 찾기를 열어 컬렉션·그룹·별점 중 하나를 선택하고 다시 해제해 보세요. 목록 필터만 바뀌며 악보가 자동으로 열리지 않아야 합니다.
    320/390/840px 및 200% 글자의 자동 위젯 검사는 실기기 검수와 구분합니다. 뷰어는 제목/뒤로 가기와 작업 도구가 분리되고, 낮은 가로화면/큰 글자에서 작업 도구가 가로 스크롤되는지 확인해 주세요.
    악보함: 정렬·즐겨찾기는 바로 사용하고 태그/컬렉션/그룹/별점은 필터 버튼으로 진입합니다. 빠른 접근은 펼쳐 사용합니다. 선택 모드에서 제목/checkbox로 선택하고 일괄 편집의 취소·실패·재시도와 처리 중 닫기 차단을 확인해 주세요.
    새 이름과 아이콘, 악보함의 중립 바탕과 임시 강조색·검색·빈 화면·로딩·오류 표시를 확인해 주세요.
    iPhone/iPad와 큰 글씨·다크 모드에서 제목과 카드가 잘리지 않는지 확인해 주세요.
    직접 만든 PDF를 가져와 열고 주석을 저장한 뒤 앱을 다시 실행해 보존되는지 확인해 주세요.
    악보를 세트리스트에 추가하고 공유/백업 결과를 확인해 주세요.
    소유한 오디오 파일을 악보에 연결하고 A-B 반복 재생·정지를 빠르게 눌러 확인해 주세요.
    구간 저장 중 창을 닫았을 때 뒤늦게 재생되지 않는지 확인해 주세요. 실제 청감은 별도 확인이 필요합니다.
    구간 추가·삭제·지우기 중 재생이 비활성화되고 실패 후 재시도 가능한지도 확인해 주세요.
    정지 오류 시 안내와 재시도, 개발자 기기 리포트의 정지 요청/상태 확인 경고를 확인해 주세요.
    오디오 창을 닫고 다시 재생할 때 이전 창의 정리로 새 재생이 멈추지 않는지 확인해 주세요.
    연결 오디오 사용 중 엔진 확인은 재생을 대신 시작하지 않고 경고합니다. 실제 청감·출력 경로는 별도 기록해 주세요.
    연습 → 연결 음원 → 소유한 음원을 열어 파일명, 재생 대기/실행/실패 상태와 재생/정지 행동을 확인해 주세요. 앱 저장소의 절대 경로가 기본 화면에 보이지 않아야 합니다. 실제 codec·스피커/유선/Bluetooth 출력·VoiceOver·큰 글씨는 별도 Device QA로 기록해 주세요.
    모든 도구 → 보기 옵션 → 파트/버전에서 현재 PDF와 연결 파일의 파일명·역할·상태를 확인해 주세요. 파일이 없거나 열 수 없는 형식이면 열기만 비활성이고 역할 변경·연결 제거는 가능해야 하며, 파일 전환 뒤 원본 PDF와 기존 metadata가 보존되어야 합니다.
    모든 도구 → 보기 옵션 → 악보 메모에서 공연/리허설/조율/편성 메모를 입력한 뒤 취소와 저장을 확인해 주세요. 취소 시에는 원본 metadata가 바뀌지 않고, 저장 뒤 다시 열면 내용이 남아야 합니다. 큰 글씨와 키보드에서 저장·취소까지 접근 가능한지도 확인해 주세요.
    악보 메모 저장 중에는 입력·취소·Back·바깥 탭·아래로 끌기로 닫히지 않고, 완료 후에만 저장 안내가 나와야 합니다. 저장 실패 시 입력과 선택한 악보를 유지하며 다시 시도할 수 있어야 합니다.
    모든 도구 → 보기 옵션 → 북마크 목록에서 항목 또는 이동을 눌러 대상 쪽으로 이동하고, 더보기의 이름 변경·삭제가 각각 해당 bookmark만 바꾸는지 확인해 주세요. 큰 글씨와 VoiceOver에서 목록 scroll·행·이동·더보기 순서도 기록해 주세요.
    모든 도구 → 페이지 정리 → 숨김 페이지 관리에서 숨긴 쪽의 숨김 해제 후 해당 쪽으로 이동하는지 확인해 주세요. 큰 글씨와 VoiceOver에서 목록 scroll·행·숨김 해제 순서도 기록해 주세요.
    모든 도구 → 페이지 정리 → 페이지 순서/복제에서 위/아래/복제/기본값 복원 뒤 원본 PDF와 기존 주석이 보존되는지 확인해 주세요. 큰 글씨와 VoiceOver에서 목록 scroll과 각 행동 순서도 기록해 주세요.
    모든 도구 → 페이지 정리 → 점프 포인트에서 현재 쪽의 추가, 대상 페이지 선택, 이동·이름 변경·삭제를 확인해 주세요. 숨긴 쪽을 포함한 항목은 이동만 막히고 수정·삭제는 가능한지, 큰 글씨와 VoiceOver에서 목록 scroll·행·더보기 순서도 기록해 주세요.
    모든 도구 → 페이지 정리 → 리허설 마크에서 현재 페이지 추가, 마크 종류·페이지·이름 편집, 이동·삭제를 확인해 주세요. 공연 모드에서는 이동만 가능하고 편집 행동은 보이지 않는지, 큰 글씨와 VoiceOver에서 목록·입력 창 scroll과 저장/취소 순서도 기록해 주세요.
    모든 도구 → 보기 옵션 → 보기 모드에서 1페이지·2페이지·세로 스크롤 전환을 확인해 주세요. 좁은 화면의 2페이지 제한, 기존 PDF·주석·현재 페이지 보존과 큰 글씨·VoiceOver sheet 순서를 기록해 주세요.
    모든 도구 → 보기 옵션 → 표시 효과와 페이지 맞춤에서 현재 선택·전환, PDF·주석·현재 페이지 보존을 확인해 주세요. 실제 색상 대비, crop·scroll 감각과 VoiceOver는 기기별로 기록해 주세요.
    모든 도구 → 보기 옵션 → 페달 매핑에서 표준·반전·세트리스트 경계 이동·직접 설정을 확인해 주세요. 실제 Bluetooth/USB 페달, 키보드 입력과 VoiceOver는 기기별로 기록해 주세요.
    모든 도구 → 보기 옵션 → 렌더링과 페이지 넘김에서 설정 전환 뒤 PDF·주석·현재 페이지 보존을 확인해 주세요. 긴 PDF 성능, 실제 전환 감각, 페달·VoiceOver는 기기별로 기록해 주세요.
    모든 도구 → 보기 옵션 → 페달 매핑 → 직접 설정에서 긴 입력 이름·선택값과 저장을 확인해 주세요. 실제 USB/Bluetooth 장비, 재시작 뒤 입력 동작과 VoiceOver는 기기별로 기록해 주세요.
    모든 도구 → 보기 옵션에서 목적별 구획과 모든 기존 도구 진입이 보이는지 확인해 주세요. 390px·200% 글자에서 목록 scroll·focus 복귀·VoiceOver heading/행 순서는 별도 Device QA로 기록해 주세요.
    모든 도구 → 페이지 정리에서 공통 행의 이름·아이콘·메뉴를 확인하고, 숨김 페이지 관리·페이지 순서/복제·점프 포인트·리허설 마크로 각각 진입해 주세요. 실제 PDF 변형 사본 생성과 VoiceOver·큰 글씨는 Device QA로 기록해 주세요.
    모든 도구 → 페이지 정리 → 입력 진단에서 빈 상태·입력 로그·진단 로그 복사와 직접 설정 진입을 확인해 주세요. 실제 Bluetooth/USB 페달, 키보드, VoiceOver와 큰 글씨는 Device QA로 기록해 주세요.
    모든 도구 → 공연 설정에서 시작 전 확인·세트리스트 이동·공연 중 허용 도구와 preset template을 확인해 주세요. 취소하면 기존 설정이 남고, 저장 뒤 다시 열면 변경이 남아야 합니다. 실제 화면 켜짐 유지, 외부 입력, VoiceOver와 큰 글씨는 Device QA로 기록해 주세요.
    넓은 화면 상단의 페이지 정리와 모든 도구 안의 페이지 정리에서 같은 메뉴 항목·비활성 상태가 보이는지 확인해 주세요. 메뉴를 여닫아도 PDF·주석·현재 페이지가 바뀌지 않아야 합니다.
