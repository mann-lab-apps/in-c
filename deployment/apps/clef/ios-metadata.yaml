  - id: annotation
    purpose: 실제 PDF 렌더러의 저장된 주석과 R2 입력 모드/현재 도구/옵션/페이지 footer를 표시. 실기기 품질 검증 장면이 아님.
    route: 라이브러리 → 자가 제작 악보 열기 → 주석 모드 → 미리 저장한 주석 표시 (옵션/연습 패널 닫힘)
    fixture: 직접 만든 악보와 짧은 연습 표시. 오디오 품질 증거용 장면이 아님
    must_show:
    - 읽을 수 있는 악보와 adapter가 실제로 저장한 형광펜·펜 주석
    - 제목·뒤로 가기, 읽기/주석 입력 모드와 별도 연습/공연 진입
    - 현재 펜 옵션과 undo/redo, 지면을 가리지 않는 하단 페이지 이동
    - 연결 오디오 패널이 가리지 않는 PDF
    - 흰색 또는 무채색 작업 면·읽을 수 있는 본문, 선택 상태는 강조색과 기호/문구로 구분. 악보 지면·저장된 주석·음원 의미색 유지
    - 현재 공통 타이포와 간격에 맞는 제목·본문·레이블. 표시 중인 선택 컨트롤은 얇은 경계와 선택 면/기호로 구분하고 내용이 잘리지 않을 것
    exclude:
