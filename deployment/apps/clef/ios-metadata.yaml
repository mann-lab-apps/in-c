      name: 띠로리 스코어
      subtitle: PDF 악보와 세트리스트
      description: |-
        띠로리 스코어는 연습과 공연을 위한 악보 앱입니다. 이전 이름은 Clef & Staff입니다.

        PDF, JPG, PNG 악보와 일반 텍스트, ChordPro 파일을 가져와 한곳에서 관리할 수 있습니다. DOCX와 RTF 문서는 읽기 쉬운 텍스트로 추출해 확인할 수 있습니다.

        제목, 작곡가, 태그, 컬렉션과 사용자 필드로 악보를 정리하고, 필요한 악보를 세트리스트로 묶어 연주 순서를 준비하세요. 세트리스트와 관련 악보는 ZIP 패키지로 공유하고 다른 기기에서 다시 가져올 수 있습니다.

        악보 뷰어
        • 터치와 키보드를 이용한 페이지 넘김
        • 1페이지, 2페이지, 세로 스크롤 보기
        • PDF 목차, 북마크와 페이지 빠른 이동
        • 페이지 회전, 순서 변경, 여백과 배경 설정
        • 긴 악보를 위한 검색과 빠른 탐색

        필기와 공유
        • 펜, 형광펜, 도형, 텍스트와 스탬프
        • 사용자 스탬프와 이미지 스탬프
        • 여러 필기 레이어 생성, 이름 변경과 이동
        • 필기가 포함된 PDF 사본 공유
        • 지원되는 필기의 편집 가능한 PDF 주석 내보내기

        연습 도구
        • 박자, subdivision, 강세와 탭 템포를 지원하는 메트로놈
        • 현재 음과 cents 변화를 보여주는 크로매틱 튜너
        • 드론과 기준음 재생
        • 연결 오디오와 A-B 반복 구간
        • Bluetooth/USB 페달과 키보드 페이지 이동 설정

        악보와 필기, 세트리스트는 기본적으로 사용자의 기기에 보관됩니다. 공연 전에는 중요한 라이브러리를 백업하는 것을 권장합니다.
      keywords: 악보,PDF악보,악보앱,세트리스트,필기,메트로놈,튜너,sheet music,pdf score,metronome,tuner
      promotional_text: PDF·이미지·텍스트·ChordPro 악보를 한곳에서 정리하고, 세트리스트 공유, 레이어 필기, 메트로놈과 튜너로 연습부터 공연까지 준비하세요.
      support_url: https://in-c.mannlab.app/clef-and-staff/support.html
      marketing_url: https://in-c.mannlab.app/clef-and-staff/
      privacy_url: https://in-c.mannlab.app/clef-and-staff/privacy.html
      release_notes: |-
        세트리스트 이름 입력을 취소하거나 저장한 뒤에도 입력 창이 안전하게 닫히도록 개선했습니다.
        앱이 관리하던 PDF·연결 파일·파일형 주석이 새 앱 저장소에 남아 있을 때 이전 저장소 경로를 복구해 다시 열 수 있도록 개선했습니다.
        PDF, 이미지 PDF와 공유받은 PDF는 악보함 목록에 보이기 전에 라이브러리 저장을 완료합니다. 저장에 실패하면 성공으로 안내하지 않으며, 앱 내부에 만든 사본만 정리합니다.
        빈 악보함의 첫 행동을 PDF 악보 추가로 명확히 하고, Studio에서 내보낸 PDF도 파일 앱에서 직접 가져올 수 있음을 안내합니다. Studio 프로젝트나 MusicXML을 PDF처럼 열지는 않습니다.
        악보 정보의 연결 파일에서 Play 등에서 내보낸 음원을 현재 악보에 사본으로 연결할 수 있음을 안내합니다. 지원 파일 형식 선택과 실제 기기 재생 호환성은 구분합니다.
        악보함의 제목과 라이브러리 전환을 간결하게 정리해 검색과 목록에 더 빨리 접근할 수 있습니다.
        악보 보기에서 읽기·주석 입력 모드, 연습 도구와 공연 제한을 구분했습니다. 주석 도구의 색·굵기·스탬프·텍스트는 옵션 창에서 선택하며, 도구를 숨겨도 페이지 이동과 복원 버튼을 사용할 수 있습니다.
        주석 저장 중 중복 입력을 방지하고 실패한 변경은 다시 저장할 수 있습니다. 저장에 성공한 뒤에만 주석 모델을 갱신하며, 이전 문서의 늦은 페이지 응답을 무시합니다.
        악보함을 라이브러리·검색·정렬/필터·접힌 빠른 접근 순서로 정리했습니다. 선택한 악보가 필터 밖에 있어도 개수를 표시하며, 일괄 편집은 저장에 성공한 뒤에만 원본에 반영합니다.
        큰 글씨에서 일괄 편집 선택 항목이 줄바꿈되며, 뷰어에서는 제목·뒤로 가기와 읽기·주석·연습 도구를 분리했습니다.
        악보함 검색·정렬·필터와 선택 목록을 공통 컴포넌트로 정리했습니다. 큰 글씨에서 제목이 줄바꿈되며, 일괄 편집 실패 시 입력을 유지하고 재시도할 수 있습니다.
        앱 표시명을 띠로리 스코어로 정리하고 공통 테마와 새 아이콘을 적용했습니다.
        악보함 검색, 빈 화면, 불러오기와 오류 안내를 공통 디자인으로 정리했습니다.
        모바일 악보 목록의 카드 높이 오류를 수정하고 큰 글씨에서 카드 높이를 조정했습니다.
        현재 페이지와 여러 페이지에 공통으로 적용할 PDF 여백을 제안합니다. 적용 전 악보 내용이 잘리지 않는지 확인할 수 있습니다.
        라이브러리 탐색 성능과 폴더 가져오기의 취소·오류 복구를 개선했습니다.
        연결 오디오의 재생 위치와 진행률을 확인하고 반복 구간을 더 편리하게 조정할 수 있습니다.
        연결 오디오의 반복 구간 저장 중 화면을 닫았을 때 뒤늦게 재생되는 문제를 수정했습니다.
        재생과 정지 처리 중 중복 조작을 방지하고, 저장 실패 후 다시 시도할 수 있도록 개선했습니다.
        반복 구간 추가·삭제·지우기와 재생이 겹쳐 이전 구간이 다시 저장되는 문제를 수정했습니다.
        오디오 정지 실패 시 재시도를 제공하고, 기기 점검에서 정지 상태 확인 불가를 경고로 구분합니다.
        이전 오디오 창의 정리가 새 재생을 중단하지 않도록 개선하고, 기기 점검이 사용 중인 연결 오디오를 대신 재생하지 않도록 했습니다.
        큰 글씨 설정에서 최근 악보·정보 정리 카드와 세트리스트 진행 배지가 잘리는 문제를 개선했습니다.
        공통 테마의 색상과 컨트롤 모서리를 정돈하고 제품 아이콘을 업데이트했습니다.

        화면 바탕과 글자색을 중립색으로 정리하고 선택된 항목을 더 명확하게 구분했습니다.

        선택 컨트롤의 테두리와 글자 굵기를 정리하고 공통 제목·본문·간격 기준을 적용했습니다.

        공통 글자 위계와 악보함 여백을 정리하고 선택 버튼 및 설정창의 상태 표현을 개선했습니다.
        분류별 찾기의 컬렉션·그룹·별점 선택을 공통 선택 컨트롤과 간격 기준으로 정리해, 좁은 화면과 큰 글씨에서도 읽기 쉽게 개선했습니다.
        주석 옵션을 공통 도구 모음의 표면·간격·포커스 순서 안에 정리하면서 기존 펜·색·굵기·스탬프·레이어·undo/redo 도구는 그대로 유지했습니다.
        PDF 페이지 이동을 공통 페이지 컨트롤로 정리하고 읽기·주석·연습·공연 상태를 함께 표시합니다. 실제 페이지 순서와 이동 가능 여부는 기존 악보 설정을 그대로 따릅니다.
        공연 모드의 빠른 동작과 자동 스크롤 시작 안내를 공통 overlay 색·글자·선택 강조 기준에 맞춰 정리했습니다.
        페이지 메타와 빠른 이동 도구도 같은 overlay 색·글자·모서리 기준으로 정리했습니다.
        PDF 여백 자르기 설정의 설명과 초기화/저장 행동을 공통 글자·간격·버튼 기준으로 정리했습니다.
        PDF 파일을 찾지 못하거나 열지 못했을 때 공통 상태 패널에서 복구 안내를 먼저 보여주고, 경로와 오류 상세는 진단 정보로 확인할 수 있게 했습니다.
        메트로놈의 시작/정지, BPM, 박자와 click 소리 설정을 공통 제목·버튼·선택 기준으로 정리하고, 좁은 화면에서도 모든 제어를 스크롤해 사용할 수 있게 했습니다.
        자동 스크롤의 시작·일시정지·재개·정지와 pause marker·반복 구간·cue point 설정을 공통 제목·동작 기준으로 정리하고, 좁은 화면에서 긴 동작이 넘치지 않게 했습니다.
        자동 스크롤 설정을 공통 sheet와 section으로 정리하고, 큰 글씨와 가로 화면에서도 연주 시간·쪽별 속도·시작 큐·페이지 범위에 접근할 수 있도록 개선했습니다.
        튜너의 마이크 행동과 긴 프리셋·악기·감지·드론 선택값을 공통 제목·아이콘·작은 화면 기준으로 정리했습니다. 실제 마이크와 드론 품질은 기기별로 확인합니다.
        연결 음원 재생 화면에서 파일명, 재생 상태와 재생/정지 행동을 공통 기준으로 정리하고 앱 저장소 경로를 기본 화면에 표시하지 않도록 했습니다. 실제 재생 호환성과 출력 품질은 기기별로 확인합니다.
        연결 음원을 공통 sheet·상태·행동으로 정리해 작은 화면에서도 파일 정보와 재생 제어를 일관되게 확인할 수 있도록 개선했습니다.
        파트와 연결 파일 화면에서 현재 악보와 파일별 역할·가용 상태·열기/변경/제거 행동을 구분하고, 앱 저장소 경로 대신 파일명을 표시합니다.
        악보 메모에서 공연·리허설·조율·편성 메모를 큰 글씨에서도 입력하고 저장할 수 있도록 화면 위계를 정리했습니다.
        북마크 목록에서 페이지 이동과 이름 변경·삭제 행동을 구분하고, 큰 글씨에서도 목록을 스크롤해 사용할 수 있도록 정리했습니다.
        숨긴 페이지 관리에서 다시 표시할 쪽과 이동 행동을 분리해, 큰 글씨에서도 목록을 스크롤해 사용할 수 있도록 정리했습니다.
        페이지 순서/복제에서 앱 안의 표시 순서 변경과 원본 PDF 보존을 구분해, 큰 글씨에서도 목록을 스크롤해 사용할 수 있도록 정리했습니다.
        점프 포인트에서 현재 쪽의 바로가기 추가와 대상 쪽 선택, 이동·이름 변경·삭제를 구분해 큰 글씨에서도 목록을 스크롤해 사용할 수 있도록 정리했습니다.
        리허설 마크에서 현재 페이지 추가와 이동·이름 변경·삭제, 마크 종류·페이지 입력을 구분해 큰 글씨에서도 목록과 입력 창을 사용할 수 있도록 정리했습니다.
        보기 방식에서 현재 선택·사용 가능·좁은 화면 제한을 구분해 PDF와 주석을 유지한 채 화면 배치를 바꿀 수 있도록 정리했습니다.
        표시 효과와 페이지 맞춤에서 현재 선택과 가능한 선택을 구분해 PDF·주석·현재 페이지를 유지한 채 화면 표시와 지면 맞춤을 바꿀 수 있도록 정리했습니다.
        페달 매핑에서 현재 설정·선택 가능한 페이지 넘김 방식과 직접 설정 편집 진입을 구분해 입력 설정을 더 쉽게 확인할 수 있도록 정리했습니다.
        렌더링 프로필과 페이지 넘김 효과에서 현재 설정과 선택 가능한 설정을 구분해 보기 성능과 전환 방식을 더 쉽게 확인할 수 있도록 정리했습니다.
        직접 페달 설정에서 진단 입력과 기본 입력의 동작 선택·저장을 정리하고, 작은 화면에서 긴 선택값이 잘리지 않도록 개선했습니다.
        좁은 화면의 보기 옵션을 읽기·연습·필기·페이지 편집·공유와 진단으로 구분해, 기존 악보 도구를 더 쉽게 찾을 수 있도록 정리했습니다.
        모든 도구의 페이지 정리를 공통 행과 메뉴로 표시해, 페이지 편집 도구의 아이콘·이름·행동을 일관되게 확인할 수 있도록 정리했습니다.
        입력 진단을 공통 sheet·상태 행·행동으로 정리해, 입력 기록 확인과 직접 설정 진입을 작은 화면에서도 일관되게 사용할 수 있도록 개선했습니다.
        공연 설정을 공통 sheet와 section으로 정리해, 시작 전 확인·세트리스트 이동·공연 중 허용 도구와 preset template을 구분했습니다. 저장 전 선택은 기존 설정을 바꾸지 않습니다.
        상단 페이지 정리 메뉴도 공통 메뉴 컴포넌트로 통일해, 넓은 화면과 모든 도구에서 같은 메뉴 계약을 사용하도록 정리했습니다.
