    route: 현재 라이브러리 → 검색 → 정렬/즐겨찾기/필터 → 기본 목록 (분류별 찾기와 빠른 접근 접힘, 선택 모드 해제)
    fixture: 자가 제작 악보 3개 이상, 컬렉션과 즐겨찾기 포함
    must_show:
    - 검색 위의 간결한 현재 라이브러리 전환 버튼과 곡 수, 접힌 분류별 찾기 (분류가 있을 때; 펼친 공통 선택 컨트롤은 widget/manual QA)
    - 띠로리 스코어 제품명과 제품 심벌, 흰색/무채색 바탕과 임시 강조색
    - 공통 검색, 정렬·즐겨찾기·필터 진입, 기본 라이브러리와 곡 수
    - 기본 접힘 상태의 빠른 접근과 평면 목록, 넓은 화면의 2열 구성
    - 악보 제목·작곡가/파일 정보·마지막 페이지, 독립 즐겨찾기·고정·더보기 행동
    - 긴 제목 줄바꿈, 터치 영역, 좁은 폭16/넓은 폭32 여백과 명확한 타이포 위계
    exclude:
    - 빈 라이브러리, 테스트 체크리스트, 개인정보, 오류 배너
    - 큰 글씨 레이아웃 overflow 표시나 잘린 정보 편집 버튼
    - 이전 색조가 들어간 바탕의 캡처 또는 팔레트 비교용 웹 데모 화면
    - 이전 굵은 선택 밑줄·중첩 외곽선 UI, 글자나 조작부가 잘린 화면, 웹 컴포넌트 예제
    - 시스템 기준 검증용 웹 화면 또는 서로 다른 디자인 버전이 혼재한 화면
    steps:
