    ko:
      name: 띠로리 스코어
      subtitle: PDF 악보와 세트리스트
      description: |-
        띠로리 스코어는 연습과 공연을 위한 악보 앱입니다. 이전 이름은 Clef & Staff입니다.

        PDF, JPG, PNG 악보와 일반 텍스트, ChordPro 파일을 가져와 한곳에서 관리할 수 있습니다. DOCX와 RTF 문서는 읽기 쉬운 텍스트로 추출해 확인할 수 있습니다.

        제목, 작곡가, 태그, 컬렉션과 사용자 필드로 악보를 정리하고, 필요한 악보를 세트리스트로 묶어 연주 순서를 준비하세요. 세트리스트와 관련 악보는 ZIP 패키지로 공유하고 다른 기기에서 다시 가져올 수 있습니다.

        악보 뷰어
        • 터치와 키보드를 이용한 페이지 넘김
        • 1페이지, 2페이지, 세로 스크롤 보기
        • PDF 목차, 북마크와 페이지 빠른 이동
        • 페이지 회전, 순서 변경, 여백과 배경 설정
        • 긴 악보를 위한 검색과 빠른 탐색

        필기와 공유
        • 펜, 형광펜, 도형, 텍스트와 스탬프
        • 사용자 스탬프와 이미지 스탬프
        • 여러 필기 레이어 생성, 이름 변경과 이동
        • 필기가 포함된 PDF 사본 공유
        • 지원되는 필기의 편집 가능한 PDF 주석 내보내기

        연습 도구
        • 박자, subdivision, 강세와 탭 템포를 지원하는 메트로놈
        • 현재 음과 cents 변화를 보여주는 크로매틱 튜너
        • 드론과 기준음 재생
        • 연결 오디오와 A-B 반복 구간
        • Bluetooth/USB 페달과 키보드 페이지 이동 설정

        악보와 필기, 세트리스트는 기본적으로 사용자의 기기에 보관됩니다. 공연 전에는 중요한 라이브러리를 백업하는 것을 권장합니다.
      keywords: 악보,PDF악보,악보앱,세트리스트,필기,메트로놈,튜너,sheet music,pdf score,metronome,tuner
      promotional_text: PDF·이미지·텍스트·ChordPro 악보를 한곳에서 정리하고, 세트리스트 공유, 레이어 필기, 메트로놈과 튜너로 연습부터 공연까지 준비하세요.
      support_url: https://in-c.mannlab.app/clef-and-staff/support.html
      marketing_url: https://in-c.mannlab.app/clef-and-staff/
      privacy_url: https://in-c.mannlab.app/clef-and-staff/privacy.html
      release_notes: |-
        • 자동 스크롤 설정을 순서대로 저장하고 최신 악보 정보·즐겨찾기를 유지합니다. 저장 실패는 입력과 함께 표시하며, 스크롤을 시작하지 않고 설정만 다시 저장할 수 있습니다.
        • 자동 스크롤의 중복 시작과 도구·악보를 닫은 뒤 늦게 시작되는 경로를 보완했습니다. PDF 보기 전환 후 지면 준비를 기다리고 실패 시 재시도하며, 큰 글자의 보조 행동·쪽 표시·최근 악보 표시를 조정했습니다.
        • 악보 메모를 공통 입력 화면으로 정리했습니다. 저장 중 중복 조작·닫기를 막고 저장 실패 시 입력을 유지해 재시도하며, 저장 성공 뒤에만 완료를 안내합니다.
        • 튜너가 지속된 옥타브 이동을 이전 음으로 계속 표시하던 문제를 보완했습니다. 순간적인 배음 오류 억제는 유지하며 실제 악기·마이크 환경은 별도로 확인합니다.
        • ChordPro 붙여넣기 대기 중 라이브러리를 전환했다가 돌아와도 이전 요청의 결과나 오류가 새 화면을 덮지 않도록 보완했습니다. 이미 저장된 자료는 보존합니다.
        • 입력 진단을 공통 화면으로 정리하고 로그 복사 대기·실패·재시도를 안내합니다. 빈 입력과 직접 설정 진입을 구분하고, 닫은 화면의 늦은 복사 안내를 표시하지 않습니다.
        • ChordPro 붙여넣기 저장 실패나 라이브러리 전환으로 남은 미저장 사본을 정리합니다. 기존 원본과 다른 라이브러리가 참조하는 자료는 보존합니다.
        • 공유할 파일의 역할·파일명을 공통 선택 화면으로 정리하고 링크 제거 사본을 명시했습니다. 취소·라이브러리 전환·오래된 응답을 구분하고 파일 누락과 공유 실패 후 재시도를 보완했습니다.
        • 가져오기 저장에 실패하고 목록을 다시 읽을 수 없어도, 같은 요청이 소유한 목록은 직전 상태로 복구해 미저장 악보 카드가 남지 않도록 보완했습니다.
        • 튜너의 PCM 입력 묶음이 샘플 중간에서 나뉘어도 음정 감지가 끊기지 않도록 보완했습니다. 측정 중 감지 엔진을 바꿀 때는 같은 입력 스트림의 샘플 경계를 유지하고 실제 정지·재시작에서는 초기화합니다.
        악보함과 연습·공연 도구의 디자인과 사용 흐름을 정리했습니다.

        • PDF·이미지·공유받은 PDF는 라이브러리 저장을 마친 뒤 목록에 표시합니다. 실패하면 성공으로 안내하지 않고 앱 내부 사본만 정리합니다.
        • 앱이 관리하던 PDF·연결 파일·파일형 주석의 사본이 현재 저장소에 남아 있으면 이전 경로를 복구해 다시 열 수 있도록 개선했습니다. 링크 제거 사본의 원본 공유 참조도 같은 악보의 정확한 사본이 남아 있을 때 복구합니다. 외부 URL 링크 제거 사본은 기존 출력 파일을 덮어쓰지 않도록 보완했습니다. 이전 iOS 앱 컨테이너의 정확한 파일명만 복구 대상으로 삼고 외부 폴더·관리 폴더 밖 심볼릭 링크는 자동 연결하지 않습니다.
        • 악보함의 검색·정렬·필터·빠른 접근을 정돈했습니다. 긴 이름은 줄바꿈하고 라이브러리 전환과 관리 메뉴를 구분합니다. 정렬·분류 선택은 현재 조건과 취소를 표시하며 큰 글자·가로 화면과 긴 목록에서도 이용할 수 있습니다. 일괄 편집 실패 시 입력과 선택을 유지합니다.
        • PDF 읽기·주석 입력·연습 도구·공연 제한을 구분했습니다. 도구를 숨겨도 페이지 이동과 도구 복원을 사용할 수 있습니다.
        • 주석의 펜·색·굵기·스탬프·텍스트·레이어·undo/redo를 공통 도구로 정리하고, 저장 실패 시 다시 저장할 수 있도록 보완했습니다.
        • 긴 PDF의 쪽 번호·슬라이더·처음/끝/10쪽 이동과 북마크·리허설 마크·점프 지점 접근을 개선했습니다. 본문 검색은 PDF 내부 텍스트를 대상으로 하며 스캔 악보의 OCR 검색은 지원하지 않습니다.
        • 여백 제안·자르기·회전·숨김·페이지 순서와 사본 생성 안내를 정리했습니다. 메모·자르기·공연 설정·전역 보기 기본값은 저장 완료 후에만 닫히고, 실패하면 입력을 유지해 재시도합니다.
        • 튜너 화면을 열어도 기존 프리셋·타깃 저장값을 지우지 않고, A4·표기·감지 엔진 등 바꾼 설정만 반영합니다. 튜너·드론의 전역 설정은 저장 성공 뒤에 반영하고, 실패 시 이전 저장값과 재시도를 유지합니다.
        • 튜너의 마이크 권한 대기 중 닫기와 빠른 시작·정지·재시작을 보완해 이전 요청이 새 측정을 덮지 않도록 했습니다. 마이크 꺼짐·거절·오류 시 테스트 음정을 측정값처럼 표시하지 않으며, 표시 미리보기는 실제 측정과 구분합니다.
        • 메트로놈·튜너·드론·연결 음원 화면을 정리했습니다. 연결 음원과 반복 구간 저장·재생·정지의 중복 조작, 늦은 응답과 정지 실패 재시도를 보완했습니다.
        • 자동 스크롤의 시간·쪽별 속도·시작 큐·범위·반복 설정을 정리했습니다. 일시정지·재개·정지가 현재 상태를 반영하며, 닫기와 재진입 중 이전 저장이 최신 설정을 덮지 않도록 개선했습니다.
        • 공연 준비 안내를 큰 글자·가로 화면에서도 읽을 수 있도록 정리했습니다. 세트리스트의 악보 추가와 리허설 메모는 저장을 기다리고 실패 시 선택·입력을 유지합니다. 공연 설정과 preset 저장·삭제 실패를 안내하고, 종료된 뷰어의 늦은 준비 응답과 전환 오류를 처리합니다.
        • 파트·연결 파일·공유 대상·입력 진단·페달 매핑·렌더링 옵션의 이름과 보조 행동을 정리했습니다. 악보함과 뷰어의 공유 파일 선택을 통일하고 라이브러리 전환 뒤 오래된 선택을 차단합니다. Studio PDF와 Play 등에서 내보낸 음원은 사용자가 선택한 악보에 사본으로 가져올 수 있습니다.
