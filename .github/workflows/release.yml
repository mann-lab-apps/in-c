name: Studio alpha.46 published macOS delivery QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verify the published alpha.46 package
        required: true
        type: choice
        options:
          - preflight

permissions:
  contents: read

jobs:
  macos-delivery:
    if: inputs.tag == 'preflight'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            mode: intel
            arch: x86_64
          - runner: macos-15
            mode: rosetta
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: qa/desktop-install
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the public tag and capture release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/studio-mac-published"
          mkdir -p "$proof"
          ref='refs/tags/v0.1.0-alpha.46'
          git ls-remote origin "$ref" "$ref^{}" > "$proof/tag.txt"
          test "$(awk '$2 ~ /\^\{\}$/ {print $1}' "$proof/tag.txt")" = 2a14068892434d0c76d619c16f831a6dfaed1c1a
          gh release view v0.1.0-alpha.46 --repo mann-lab-apps/in-c \
            --json tagName,isPrerelease,isDraft,publishedAt,url,assets > "$proof/release.json"
      - name: Test packaged-app timeout evidence
        run: python3 qa/desktop-install/test_mac_smoke.py
      - name: Verify and launch the signed public Mac app
        env:
          QA_MODE: ${{ matrix.mode }}
          QA_HOST_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$QA_HOST_ARCH"
          extra=()
          if [ "$QA_MODE" = rosetta ]; then extra+=(--rosetta); fi
          python3 qa/desktop-install/verify-mac-published.py "$RUNNER_TEMP/studio-mac-published" v0.1.0-alpha.46 "${extra[@]}"
      - name: Keep launch and signed package evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-macos-published-evidence-${{ matrix.mode }}
          path: ${{ runner.temp }}/studio-mac-published/*
          if-no-files-found: warn
