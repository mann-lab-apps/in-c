name: Studio Windows MXL file-boundary QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Run compressed MusicXML file-boundary QA for the frozen Studio candidate
        required: true
        type: choice
        options:
          - preflight

permissions:
  contents: read

jobs:
  windows-file-boundaries:
    if: inputs.tag == 'preflight'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      STUDIO_QA_CANDIDATE: a1236f148de0a0a1d50e12ffb3a72d6bef2c46fe
    steps:
      - name: Check out frozen Studio candidate
        uses: actions/checkout@v7
        with:
          ref: a1236f148de0a0a1d50e12ffb3a72d6bef2c46fe
          path: candidate
          persist-credentials: false
      - name: Check out QA tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-tools
          sparse-checkout: qa/windows-save-boundaries
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Verify candidate SHA
        working-directory: candidate
        run: |
          $candidate = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $candidate -ne $env:STUDIO_QA_CANDIDATE) {
            throw "Unexpected candidate SHA $candidate"
          }
          Write-Output $candidate
      - name: Install frozen dependencies
        working-directory: candidate
        run: npm ci
      - name: Build and verify the packaged candidate
        working-directory: candidate
        run: |
          npm run package:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows compressed MusicXML save collisions on packaged code
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Unexpected runner architecture $env:RUNNER_ARCH" }
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:RUNNER_TEMP))
          $env:STUDIO_QA_FILESYSTEM = $drive.DriveFormat
          if ($env:STUDIO_QA_FILESYSTEM -ne 'NTFS') { throw "Unexpected file system $env:STUDIO_QA_FILESYSTEM" }
          Write-Output "Files: $env:STUDIO_QA_FILESYSTEM"
          node qa-tools/qa/windows-save-boundaries/run.cjs candidate/release/win-unpacked/resources/app.asar candidate/node_modules/electron/dist/electron.exe "$env:RUNNER_TEMP/studio-file-boundary-proof" candidate
          exit $LASTEXITCODE
      - name: Keep Windows file-boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-windows-mxl-file-boundary-evidence
          path: ${{ runner.temp }}/studio-file-boundary-proof/artifacts
          if-no-files-found: warn
