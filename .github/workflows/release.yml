name: Play exact build5 internal upload
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Internal upload execution label
        required: true
        type: string
permissions:
  contents: read
jobs:
  internal-upload:
    runs-on: [self-hosted, macOS, ARM64, in-c-release]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Upload authorized exact IPA and connect existing internal group
        working-directory: deployment
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_GEMFILE: /Users/jaemankim/Desktop/privates/coding/worktrees/ddirori-play-library-context-20261031/deployment/Gemfile
          BUNDLE_PATH: /Users/jaemankim/Desktop/privates/coding/in-c/deployment/vendor/bundle
        run: /opt/homebrew/bin/bundle exec /opt/homebrew/bin/ruby internal_play_build5.rb
      - name: Preserve sanitized upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-internal-build5-${{ github.run_id }}
          path: deployment/play-internal-build5-result.json
          retention-days: 14
