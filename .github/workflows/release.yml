name: Studio alpha.46 published desktop QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verify the public alpha.46 files
        required: true
        type: choice
        options:
          - preflight
      platform:
        description: Limit a follow-up verification to one platform
        type: choice
        default: both
        options:
          - both
          - windows
          - linux
      verify_runner:
        description: Exercise verify:package on the installed EXE and AppImage
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  installed-windows:
    if: inputs.tag == 'preflight' && (inputs.platform == 'both' || inputs.platform == 'windows')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            qa/desktop-install
            qa/windows-save-boundaries/fixtures
            scripts
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the published alpha.45 and alpha.46 files
        shell: pwsh
        run: |
          node qa/desktop-install/published-assets.cjs windows (Join-Path $env:RUNNER_TEMP 'studio-public-assets') (Join-Path $env:RUNNER_TEMP 'studio-windows-install/installation')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, upgrade, recover and launch the posted portable file
        env:
          VERIFY_RUNNER: ${{ inputs.verify_runner }}
        shell: pwsh
        run: |
          & qa/desktop-install/windows-install.ps1 -Downloads (Join-Path $env:RUNNER_TEMP 'studio-public-assets') -Work (Join-Path $env:RUNNER_TEMP 'studio-windows-install') -VerifyRunner:($env:VERIFY_RUNNER -eq 'true')
      - name: Keep Windows installation and generated score evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-windows-install-evidence
          path: |
            ${{ runner.temp }}/studio-windows-install/installation/*
            ${{ runner.temp }}/studio-windows-install/*/results/*
            ${{ runner.temp }}/studio-windows-install/*/files/*
          if-no-files-found: warn

  appimage-linux:
    if: inputs.tag == 'preflight' && (inputs.platform == 'both' || inputs.platform == 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            qa/desktop-install
            qa/windows-save-boundaries/fixtures
            scripts
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the published alpha.46 AppImage
        run: node qa/desktop-install/published-assets.cjs linux "$RUNNER_TEMP/studio-public-assets" "$RUNNER_TEMP/studio-linux-appimage/installation"
      - name: Launch the published x64 AppImage through FUSE and round-trip a score
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xauth xvfb xdotool x11-apps libfuse2t64
          test "$RUNNER_ARCH" = X64
          test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse
          proof="$RUNNER_TEMP/studio-linux-appimage"
          launcher="$RUNNER_TEMP/studio-public-assets/Ddirori-Studio-0.1.0-alpha.46-linux-x86_64.AppImage"
          chmod +x "$launcher"
          export XDG_CONFIG_HOME="$proof/config"
          export STUDIO_QA_APP_VERSION=0.1.0-alpha.46
          export STUDIO_QA_DELIVERY_MODE=appimage-fuse
          unset APPIMAGE_EXTRACT_AND_RUN
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' node qa/desktop-install/drive.cjs distribution "$launcher" "$proof"
      - name: Run verify:package on the published AppImage
        if: inputs.verify_runner
        shell: bash
        run: |
          proof="$RUNNER_TEMP/studio-linux-appimage"
          launcher="$RUNNER_TEMP/studio-public-assets/Ddirori-Studio-0.1.0-alpha.46-linux-x86_64.AppImage"
          export XDG_CONFIG_HOME="$proof/config"
          unset APPIMAGE_EXTRACT_AND_RUN
          fuse_type="fuse.$(basename "$launcher")"
          find_mount() {
            findmnt -rn -o FSTYPE,TARGET | awk -v expected="$fuse_type" '$1 == expected { print; found = 1 } END { exit !found }'
          }
          if find_mount; then exit 1; fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' node qa/desktop-install/run-delivered-smoke.cjs "$launcher" "$proof/installation" &
          smoke_pid=$!
          while kill -0 "$smoke_pid" 2>/dev/null; do
            if find_mount > "$proof/installation/delivered-smoke-mount.txt"; then break; fi
            sleep 0.2
          done
          wait "$smoke_pid"
          test -s "$proof/installation/delivered-smoke-mount.txt"
      - name: Keep Linux launch and generated score evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-linux-appimage-evidence
          path: |
            ${{ runner.temp }}/studio-linux-appimage/installation/*
            ${{ runner.temp }}/studio-linux-appimage/results/*
            ${{ runner.temp }}/studio-linux-appimage/files/*
          if-no-files-found: warn

  verify-output:
    needs: [installed-windows, appimage-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            qa/desktop-install
            src/musicxml/schema/musicxml-4.0
      - uses: actions/download-artifact@v8
        with:
          name: studio-windows-install-evidence
          path: evidence/windows
      - uses: actions/download-artifact@v8
        with:
          name: studio-linux-appimage-evidence
          path: evidence/linux
      - name: Validate the recorded assets and actual Native and MusicXML output
        shell: bash
        run: |
          if ! command -v xmllint; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxml2-utils
          fi
          python3 qa/desktop-install/verify-evidence.py evidence/windows evidence/linux . \
            qa/desktop-install/delivery-baselines/0.1.0-alpha.45 qa/desktop-install/delivery-baselines/0.1.0-alpha.46
