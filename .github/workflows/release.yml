name: Play Store information read-only
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Read-only Play store information
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, macOS, ARM64, in-c-release]
    timeout-minutes: 5
    steps:
      - name: Verify local inspection script hash and read Apple metadata
        working-directory: /Users/jaemankim/Desktop/privates/coding/worktrees/ddirori-play-library-context-20261031/deployment/output/classical-local-library/app-info-20261126
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_GEMFILE: /Users/jaemankim/Desktop/privates/coding/worktrees/ddirori-play-library-context-20261031/deployment/Gemfile
          BUNDLE_PATH: /Users/jaemankim/Desktop/privates/coding/in-c/deployment/vendor/bundle
        run: |
          python3 -c "import hashlib; assert hashlib.sha256(open('/tmp/play_store_info_readonly_20261126.rb','rb').read()).hexdigest() == '13e13124593981a9f583ff65078429be9541270d0a4c0e2ff0af78ebdcac4420'"
          /opt/homebrew/bin/bundle exec /opt/homebrew/bin/ruby /tmp/play_store_info_readonly_20261126.rb
