name: Studio alpha.46 Rosetta renderer QA

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: choice
        options:
          - preflight

permissions:
  contents: read

jobs:
  rosetta-renderer:
    if: inputs.tag == 'preflight'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: qa/desktop-install
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Measure first paint and trace the offline reload
        shell: bash
        run: python3 qa/desktop-install/diagnose-rosetta.py "$RUNNER_TEMP/rosetta-renderer"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rosetta-renderer
          path: ${{ runner.temp }}/rosetta-renderer
          if-no-files-found: warn
