name: Studio macOS release timing integration QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Run the fixed-source timing integration without publication
        required: true
        type: choice
        options:
          - preflight

permissions:
  contents: read

jobs:
  timing:
    if: inputs.tag == 'preflight'
    name: macOS timing integration (${{ matrix.mode }})
    runs-on: macos-15
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: [shard, timeout, faults]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-tools
          sparse-checkout: qa/release-timing-integration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 7451ea7c1a57fa25ae2830e2b3e5405acdb3d0ec
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Apply the candidate to the fixed release source
        shell: bash
        run: |
          proof="$RUNNER_TEMP/studio-timing-proof"
          mkdir -p "$proof"
          patch="qa-tools/qa/release-timing-integration/candidate.patch"
          base="$(git -C source rev-parse HEAD)"
          test "$base" = "7451ea7c1a57fa25ae2830e2b3e5405acdb3d0ec"
          printf '%s\n' "$base" > "$proof/source-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$proof/qa-sha.txt"
          shasum -a 256 "$patch" | cut -d ' ' -f 1 > "$proof/candidate-patch-sha256.txt"
          git -C source apply --check "$PWD/$patch"
          git -C source apply --index "$PWD/$patch"
          git -C source diff --cached --check
          git -C source write-tree > "$proof/candidate-tree.txt"
      - run: npm ci
        working-directory: source
      - name: Run candidate Vitest checks
        env:
          STUDIO_QA_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          bash qa-tools/qa/release-timing-integration/run-cases.sh "$STUDIO_QA_MODE" source "$RUNNER_TEMP/studio-timing-proof"
      - if: matrix.mode == 'shard'
        run: npm run test:tools
        working-directory: source
      - name: Upload proof including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-timing-integration-${{ matrix.mode }}
          path: ${{ runner.temp }}/studio-timing-proof/
          if-no-files-found: error
