name: Studio native x64 size verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verify the frozen Studio candidate on native x64 runners
        required: true
        type: choice
        options:
          - preflight
      candidate_sha:
        description: Frozen Studio candidate commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-x64:
    if: inputs.tag == 'preflight'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            package-command: package:win
            target: --win
          - os: ubuntu-latest
            name: linux
            package-command: package:linux
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      FROZEN_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Check out product candidate
        uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check out QA tools
        uses: actions/checkout@v7
        with:
          path: qa-tools
          ref: ${{ github.sha }}
          sparse-checkout: qa/desktop-size
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Pin candidate and restore the exact PNG baseline
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then scratch="$(cygpath -u "$scratch")"; fi
          mkdir -p "$scratch/studio-size-evidence"
          proof="$scratch/studio-size-evidence"
          test "$RUNNER_ARCH" = X64
          [[ "$FROZEN_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "$FROZEN_CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = e685ea1f0809f31ef208cbd63ba4181c2fd84a7e
          git -C candidate worktree add --detach "$scratch/studio-size-base" "$FROZEN_CANDIDATE_SHA"
          git -C "$scratch/studio-size-base" apply --index --binary --unidiff-zero "$PWD/qa-tools/qa/desktop-size/restore-baseline.patch"
          test "$(git -C "$scratch/studio-size-base" write-tree)" = 4777b80efd4b6fcdbbba29546f0d050e2f7d0c23
          {
            git -C candidate log -1 --format='candidate=%H tree=%T'
            printf 'baseline-tree=%s\n' "$(git -C "$scratch/studio-size-base" write-tree)"
            printf 'qa=%s runner=%s arch=%s image=%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageVersion:-unknown}"
            node --version
            npm --version
          } > "$proof/source.txt"
      - name: Prepare Ubuntu desktop and FUSE
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xauth xvfb libfuse2t64
          test "$(uname -m)" = x86_64
          test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse
      - name: Build candidate delivery formats
        shell: bash
        working-directory: candidate
        env:
          STUDIO_PACKAGE_COMMAND: ${{ matrix.package-command }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then scratch="$(cygpath -u "$scratch")"; fi
          npm ci 2>&1 | tee "$scratch/studio-size-evidence/candidate-npm-ci.log"
          npm run "$STUDIO_PACKAGE_COMMAND" 2>&1 | tee "$scratch/studio-size-evidence/candidate-build.log"
          git diff --exit-code
      - name: Build the baseline renderer package
        shell: bash
        env:
          STUDIO_BASELINE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then scratch="$(cygpath -u "$scratch")"; fi
          cd "$scratch/studio-size-base"
          npm ci 2>&1 | tee "$scratch/studio-size-evidence/baseline-npm-ci.log"
          npm run package:dir -- "$STUDIO_BASELINE_TARGET" --x64 --publish never 2>&1 | tee "$scratch/studio-size-evidence/baseline-build.log"
          test "$(git write-tree)" = 4777b80efd4b6fcdbbba29546f0d050e2f7d0c23
          git diff --exit-code
      - name: Install and verify Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & qa-tools/qa/desktop-size/verify-windows.ps1 -Source candidate -Baseline "$env:RUNNER_TEMP/studio-size-base" -Evidence "$env:RUNNER_TEMP/studio-size-evidence"
      - name: Verify native AppImage launch and mounted renderer
        if: runner.os == 'Linux'
        shell: bash
        run: node qa-tools/qa/desktop-size/verify-delivery.mjs candidate "$RUNNER_TEMP/studio-size-base" "$RUNNER_TEMP/studio-size-evidence"
      - name: Retain native package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-size-${{ matrix.name }}-x64
          path: ${{ runner.temp }}/studio-size-evidence
          if-no-files-found: error
