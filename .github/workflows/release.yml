name: Studio alpha.46 Rosetta startup QA

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: choice
        options:
          - preflight

permissions:
  contents: read

jobs:
  rosetta-startup:
    if: inputs.tag == 'preflight'
    strategy:
      fail-fast: false
      matrix:
        order: [app-first, node-first]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: qa/desktop-install
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Measure the signed alpha.46 app and Node-only control
        shell: bash
        env:
          QA_ORDER: ${{ matrix.order }}
        run: python3 qa/desktop-install/diagnose-rosetta.py "$RUNNER_TEMP/rosetta-startup" "$QA_ORDER"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rosetta-startup-${{ matrix.order }}
          path: ${{ runner.temp }}/rosetta-startup
          if-no-files-found: warn
