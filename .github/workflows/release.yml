name: Play read-only ASC inspection
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Diagnostic label only; no tag is created or published
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, macOS, ARM64, in-c-release]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: deployment
      - name: Read Play app and build metadata only
        working-directory: deployment
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bundle exec ruby inspect_play_asc.rb
      - name: Preserve sanitized inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-asc-readonly-${{ github.run_id }}
          path: deployment/play-asc-inspection.json
          retention-days: 7
