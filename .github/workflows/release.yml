name: Studio alpha.45 published desktop QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verify the public alpha.45 files
        required: true
        type: choice
        options:
          - preflight
      platform:
        description: Limit a follow-up verification to one platform
        type: choice
        default: both
        options:
          - both
          - windows
          - linux
          - macos

permissions:
  contents: read

jobs:
  installed-windows:
    if: inputs.tag == 'preflight' && (inputs.platform == 'both' || inputs.platform == 'windows')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            qa/desktop-install
            qa/windows-save-boundaries/fixtures
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the published alpha.44 and alpha.45 files
        shell: pwsh
        run: |
          node qa/desktop-install/published-assets.cjs windows (Join-Path $env:RUNNER_TEMP 'studio-public-assets') (Join-Path $env:RUNNER_TEMP 'studio-windows-install/installation')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, upgrade, recover and launch the posted portable file
        shell: pwsh
        run: |
          & qa/desktop-install/windows-install.ps1 -Downloads (Join-Path $env:RUNNER_TEMP 'studio-public-assets') -Work (Join-Path $env:RUNNER_TEMP 'studio-windows-install')
      - name: Keep Windows installation and generated score evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-windows-install-evidence
          path: |
            ${{ runner.temp }}/studio-windows-install/installation/*
            ${{ runner.temp }}/studio-windows-install/*/results/*
            ${{ runner.temp }}/studio-windows-install/*/files/*
          if-no-files-found: warn

  appimage-linux:
    if: inputs.tag == 'preflight' && (inputs.platform == 'both' || inputs.platform == 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            qa/desktop-install
            qa/windows-save-boundaries/fixtures
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the published alpha.45 AppImage
        run: node qa/desktop-install/published-assets.cjs linux "$RUNNER_TEMP/studio-public-assets" "$RUNNER_TEMP/studio-linux-appimage/installation"
      - name: Launch the published x64 AppImage through FUSE and round-trip a score
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xauth xvfb xdotool x11-apps libfuse2t64
          test "$RUNNER_ARCH" = X64
          test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse
          proof="$RUNNER_TEMP/studio-linux-appimage"
          launcher="$RUNNER_TEMP/studio-public-assets/Ddirori-Studio-0.1.0-alpha.45-linux-x86_64.AppImage"
          chmod +x "$launcher"
          export XDG_CONFIG_HOME="$proof/config"
          export STUDIO_QA_APP_VERSION=0.1.0-alpha.45
          export STUDIO_QA_DELIVERY_MODE=appimage-fuse
          unset APPIMAGE_EXTRACT_AND_RUN
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' node qa/desktop-install/drive.cjs distribution "$launcher" "$proof"
      - name: Keep Linux launch and generated score evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-linux-appimage-evidence
          path: |
            ${{ runner.temp }}/studio-linux-appimage/installation/*
            ${{ runner.temp }}/studio-linux-appimage/results/*
            ${{ runner.temp }}/studio-linux-appimage/files/*
          if-no-files-found: warn

  dmg-macos:
    if: inputs.tag == 'preflight' && inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: qa/desktop-install
      - name: Verify the public candidate tag and read asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/studio-mac-published"
          mkdir -p "$proof"
          ref='refs/tags/v0.1.0-alpha.45'
          git ls-remote origin "$ref" "$ref^{}" > "$proof/tag.txt"
          test "$(awk '$2 ~ /\^\{\}$/ {print $1}' "$proof/tag.txt")" = d05cae65fef5ded3b33902b8a13fc3f4fb05e343
          gh release view v0.1.0-alpha.45 --repo mann-lab-apps/in-c \
            --json tagName,isPrerelease,isDraft,publishedAt,url,assets > "$proof/release.json"
      - name: Check the downloaded DMG and ZIP and launch the mounted app
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          python3 qa/desktop-install/verify-mac-published.py "$RUNNER_TEMP/studio-mac-published" v0.1.0-alpha.45
      - name: Keep macOS installed app and asset proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-macos-published-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/studio-mac-published/*
          if-no-files-found: warn
