name: Studio macOS release timing diagnostics

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Run diagnostics for the fixed alpha.44 source
        type: choice
        required: true
        options:
          - preflight

permissions:
  contents: read

jobs:
  timing:
    if: inputs.tag == 'preflight'
    name: macOS release timing (${{ matrix.mode }})
    runs-on: macos-15
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            scope: shard
          - mode: trace
            scope: shard
          - mode: timeout
            scope: focused
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-tools
          sparse-checkout: qa/macos-release-timing
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 7451ea7c1a57fa25ae2830e2b3e5405acdb3d0ec
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - name: Run fixed-source Vitest diagnostics
        env:
          STUDIO_CI_MODE: ${{ matrix.mode }}
          STUDIO_CI_SCOPE: ${{ matrix.scope }}
        shell: bash
        run: bash qa-tools/qa/macos-release-timing/run.sh "$STUDIO_CI_MODE" "$STUDIO_CI_SCOPE" source "$RUNNER_TEMP/studio-ci-timing"
      - if: matrix.scope == 'shard'
        run: npm run test:tools
        working-directory: source
      - name: Keep timing evidence even when Vitest fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-macos-timing-${{ matrix.mode }}
          path: ${{ runner.temp }}/studio-ci-timing/*
          if-no-files-found: error
