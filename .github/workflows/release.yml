name: Studio alpha.46 Rosetta renderer QA

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: choice
        options:
          - preflight
      analyze_previous:
        type: boolean
        default: false
      profile_callbacks:
        type: boolean
        default: false
      compare_print_layout:
        type: boolean
        default: false
      measure_first_open:
        type: boolean
        default: false
      plan_only:
        type: boolean
        default: false
      first_open_fixture:
        type: choice
        options: [both, original, larger]
        default: both

permissions:
  contents: read

jobs:
  rosetta-renderer:
    if: inputs.tag == 'preflight' && !inputs.analyze_previous && !inputs.compare_print_layout
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: qa/desktop-install
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Measure first paint and trace the offline reload
        env:
          STUDIO_QA_PROFILE_RELOAD: ${{ inputs.profile_callbacks && '1' || '0' }}
        shell: bash
        run: python3 qa/desktop-install/diagnose-rosetta.py "$RUNNER_TEMP/rosetta-renderer"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rosetta-renderer
          path: ${{ runner.temp }}/rosetta-renderer
          if-no-files-found: warn

  analyze-published-trace:
    if: inputs.tag == 'preflight' && inputs.analyze_previous && !inputs.compare_print_layout
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: qa/desktop-install
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 46125356580
          name: rosetta-renderer
          path: ${{ runner.temp }}/renderer-evidence/runner
      - name: Analyze the exact Rosetta renderer run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-evidence"
          gh run view 46125356580 -R mann-lab-apps/in-c --json conclusion,headSha,url > "$proof/run.json"
          test "$(jq -r .headSha "$proof/run.json")" = 6791c195a6038eff293adcfdca77ebc58722b2d4
          python3 qa/desktop-install/analyze-renderer-trace.py "$proof"
          jq -c . "$proof/verification.json" | sed 's/^/RENDERER_VERIFIED /'
      - uses: actions/upload-artifact@v7
        with:
          name: rosetta-renderer-analysis
          path: ${{ runner.temp }}/renderer-evidence/verification.json

  compare-print-layout:
    if: inputs.tag == 'preflight' && inputs.compare_print_layout
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.measure_first_open && (inputs.first_open_fixture == 'original' && '["open-original"]' || inputs.first_open_fixture == 'larger' && '["open-larger"]' || '["open-original","open-larger"]') || '["timing","roundtrip"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: qa/desktop-install
      - uses: actions/checkout@v7
        with:
          ref: 2a14068892434d0c76d619c16f831a6dfaed1c1a
          path: product-src
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - name: Build and compare the x64 packages under Rosetta
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          STUDIO_QA_LAYOUT_PHASE: ${{ inputs.measure_first_open && 'timing' || matrix.phase }}
          STUDIO_QA_OPEN_PHASES: ${{ inputs.measure_first_open && '1' || '0' }}
          STUDIO_QA_LAYOUT_CANDIDATE: ${{ inputs.plan_only && 'plan-only' || 'full' }}
          STUDIO_QA_SCORE_SIZE: ${{ matrix.phase == 'open-larger' && 'larger' || 'original' }}
          STUDIO_QA_LAYOUT_PAIRS: ${{ matrix.phase == 'open-larger' && '2' || '3' }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(/usr/bin/arch -x86_64 /usr/sbin/sysctl -in sysctl.proc_translated)" = 1
          scratch="$RUNNER_TEMP/print-layout-work"
          proof="$RUNNER_TEMP/print-layout-results"
          harness="$PWD/qa/desktop-install/print-layout"
          driver="$PWD/qa/desktop-install/drive.cjs"
          mkdir -p "$scratch/product" "$proof"
          git -C product-src rev-parse HEAD > "$scratch/product-sha"
          git -C product-src archive HEAD | tar -xC "$scratch/product"
          cd "$scratch/product"
          npm ci --ignore-scripts > "$proof/npm-ci.log" 2>&1
          bash "$harness/build.sh" x64 "$harness" "$scratch" "$proof"
          python3 "$harness/run.py" x64 "$scratch" "$proof" "$driver"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: studio-print-layout-rosetta-${{ matrix.phase }}
          path: ${{ runner.temp }}/print-layout-results
          if-no-files-found: error
