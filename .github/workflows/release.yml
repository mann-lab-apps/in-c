name: Verify published Studio alpha.46

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Use preflight to verify the published alpha.46 files
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-published:
    if: inputs.tag == 'preflight'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            qa/alpha46-public
            scripts
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify public assets and the signed Mac bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          proof="$RUNNER_TEMP/studio-alpha46-public"
          mkdir -p "$proof"
          export QA_SCRATCH_DIR="$RUNNER_TEMP"
          gh release view v0.1.0-alpha.46 --repo mann-lab-apps/in-c \
            --json tagName,isPrerelease,isDraft,publishedAt,url,assets > "$proof/release.json"
          printf '%s\n' "$(git rev-parse HEAD)" > "$proof/qa-sha.txt"
          python3 qa/alpha46-public/verify-published.py "$proof" v0.1.0-alpha.46 \
            2a14068892434d0c76d619c16f831a6dfaed1c1a
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-alpha46-public-evidence
          path: ${{ runner.temp }}/studio-alpha46-public/*
          if-no-files-found: error
